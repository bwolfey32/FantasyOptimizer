<style>
/* Layout: a coach's call sheet. One column of lineup rows on chalk-green paper, numbers set in a condensed jersey face, turf green as the only accent. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --surface-2: #e3e9e4;
  --ink: #13201a;
  --muted: #4a5850;
  --line: #cfd8d1;
  --accent: #075b37;
  --gold: #8a6510;
  --accent-ink: #ffffff;
  --good: #1b7a4b;
  --bad: #b23a30;
  --warn: #a8670f;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
  --sleeper-tint: #e3eaf5; --sleeper-ink: #022047; --espn-tint: #fbe7e8; --espn-ink: #8f0009; --yahoo-tint: #eee5fb; --yahoo-ink: #4a0aa6;   /* the setup tabs, in each platform's colors */
  --wx-tile: #123d2a;   /* weather icons are drawn light-on-dark, so on the light theme each sits on a dark tile */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1512; --surface: #151e1a; --surface-2: #1c2722; --ink: #e4ebe6; --muted: #a9b7af;
    --line: #29352f; --accent: #4fc38e; --accent-ink: #07130d; --good: #4fc38e; --bad: #f07a6e; --warn: #e3b052; --gold: #e2bb52;
    --sleeper-tint: #1b2a45; --sleeper-ink: #c4d4ea; --espn-tint: #3d1517; --espn-ink: #ffb4b8; --yahoo-tint: #2a1a45; --yahoo-ink: #d2bdf5; --wx-tile: transparent;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1512; --surface: #151e1a; --surface-2: #1c2722; --ink: #e4ebe6; --muted: #a9b7af;
  --line: #29352f; --accent: #4fc38e; --accent-ink: #07130d; --good: #4fc38e; --bad: #f07a6e; --warn: #e3b052; --gold: #e2bb52;
  --sleeper-tint: #1b2a45; --sleeper-ink: #c4d4ea; --espn-tint: #3d1517; --espn-ink: #ffb4b8; --yahoo-tint: #2a1a45; --yahoo-ink: #d2bdf5; --wx-tile: transparent;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 1100px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding-inline: 16px; padding-block: 18px 56px; display: flex; flex-direction: column; gap: 16px; }
/* the page runs edge to edge (viewport-fit=cover): keep the header clear of the notch and status bar, the sides clear of
   the notch in landscape, and the footer clear of the home indicator */
.wrap { padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 30px; text-transform: uppercase; }
h2 { font-size: 22px; text-transform: uppercase; }
h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .03em; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .mark { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; }
.brand .logo { flex: 0 0 auto; width: 56px; height: 56px; object-fit: contain; }
.wordmark { display: flex; flex-direction: column; min-width: 0; }
.wordmark h1 { font-size: 32px; }
.tagline { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13.5px; color: var(--muted); margin-right: 4px; background: none; border: 1px solid transparent; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.status:hover { border-color: var(--line); color: var(--ink); }
.freshp { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.freshp table { font-size: 14px; }
.freshp td { white-space: normal; vertical-align: top; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.live i { background: var(--good); }
.status.busy i { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.status.old i { background: var(--warn); }
@keyframes pulse { 50% { opacity: .3; } }

/* This week at a glance */
.brief { background: var(--surface); border: 1.8px solid var(--accent); border-radius: var(--radius); padding: 12px 16px; font-size: 16px; line-height: 1.6; }
.brief:empty { display: none; }
.brief .bteam { font-weight: 600; }
.brief .sep { color: var(--muted); margin: 0 6px; }
.blink { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; border-bottom: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.blink:hover { border-bottom-color: var(--accent); }
.blink .n { font-family: var(--font-display); font-weight: 700; font-size: 21px; font-variant-numeric: tabular-nums; }
.blink .n.up { color: var(--good); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sel, .inp { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.inp:focus, .sel:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.danger { color: var(--bad); }

/* Tabs */
/* the four main tabs sit in a solid green band, so they read as navigation rather than another row of buttons;
   light labels, the current tab a lighter raised pill, and a short white underline under each label */
.tabs { display: flex; gap: 4px; padding: 6px; border-radius: 12px; background: linear-gradient(160deg, #0a6b41, #054a2c); box-shadow: 0 2px 8px rgba(0, 0, 0, .15); }
.tabs .navlink { position: relative; flex: 1 1 0; display: grid; place-items: center; min-height: 46px; padding: 8px 14px 10px; border-radius: 8px; text-decoration: none; font-family: var(--font-display); font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; line-height: 1.1; color: rgba(255, 255, 255, .78); white-space: nowrap; text-align: center; }
.tabs .navlink:hover { color: #fff; background: rgba(255, 255, 255, .07); }
.tabs .navlink[aria-current="page"] { color: #fff; background: rgba(255, 255, 255, .17); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .7), 0 1px 3px rgba(0, 0, 0, .25); }
.tabs .navlink::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 22px; height: 2px; margin-left: -11px; border-radius: 2px; background: rgba(255, 255, 255, .45); }
.tabs .navlink[aria-current="page"]::after { width: 32px; margin-left: -16px; background: #fff; }
#acctBtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
#acctBtn { display: inline-flex; align-items: center; gap: 7px; }
#acctBtn i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
#acctBtn .acct-ico { display: none; }
#acctBtn i.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
#acctBtn i.err, #acctBtn i.wait { background: var(--warn); }
.acct-form { display: flex; flex-wrap: wrap; gap: 8px; }
.acct-form .inp { flex: 1 1 220px; max-width: 360px; }
.acct-or { display: flex; align-items: center; gap: 10px; max-width: 520px; color: var(--muted); font-size: 13px; }
.acct-or::before, .acct-or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.acct-choice { display: flex; flex-wrap: wrap; gap: 8px; }
.gbtn { display: inline-flex; align-items: center; gap: 10px; }
.gbtn svg { flex: none; }
.hist .hdet > td { padding: 4px 10px 12px; background: var(--surface-2); }
.hist .hdet table { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
.hist .hbench td { color: var(--muted); }
/* Pro: header button, lock lines, the Pro page */
.gopro { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); color: var(--gold); font-weight: 600; }
.gopro.is-pro { color: var(--accent); border-color: var(--accent); }
.gopro[aria-pressed="true"] { background: color-mix(in srgb, var(--gold) 10%, var(--surface)); }
/* Pro and Account / Sign in sit together as one control in the header, Pro first */
.acct-grp { display: inline-flex; align-items: stretch; }
.acct-grp .gopro:not([hidden]) + #acctBtn { margin-left: -1px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.acct-grp .gopro:has(+ #acctBtn:not([hidden])) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.acct-grp .gopro { background: color-mix(in srgb, var(--gold) 10%, var(--surface)); }
/* phones: Pro / Account go top right beside the logo; the data status and Refresh share the row below */
@media (max-width: 600px) {
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 8px; }
  .top > .controls { display: contents; }
  .top .acct-grp { grid-column: 2; grid-row: 1; }
  .top .acct-grp .btn { padding: 6px 10px; }
  .top #status { grid-column: 1; grid-row: 2; justify-self: start; margin-right: 0; }
  .top [data-act="reload"] { grid-column: 2; grid-row: 2; justify-self: end; }
  .brand { gap: 10px; }
  .brand .logo { width: 44px; height: 44px; }
  .tagline { font-size: 10.5px; letter-spacing: .1em; }
  .wordmark h1, .tagline, .top #status { white-space: nowrap; }
  .top [data-act="reload"] { padding: 6px 10px; }
}
@media (max-width: 400px) {
  #acctBtn .acct-ico { display: block; }
  .top .wordmark h1 { font-size: 22px; }
  .brand { gap: 8px; }
  .brand .logo { width: 40px; height: 40px; }
  .top .acct-grp .btn { padding: 6px 8px; }
  .acct-txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tagline { font-size: 9.5px; }
  .top #status { font-size: 12.5px; padding: 4px 4px; }
}
.acct-grp .gopro.is-pro { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.acct-grp .btn:hover, .acct-grp .btn[aria-expanded="true"], .acct-grp .gopro[aria-pressed="true"] { position: relative; z-index: 1; }
.lock { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 10px 14px; border: 1px dashed color-mix(in srgb, var(--gold) 55%, var(--line)); border-radius: 8px; background: color-mix(in srgb, var(--gold) 6%, var(--surface)); color: var(--ink); text-decoration: none; font-size: 14px; }
.lock:hover { border-style: solid; }
.lock-txt { font-weight: 600; }
.lock-cta { margin-left: auto; color: var(--gold); font-weight: 600; font-size: 13px; }
.lock-row { padding: 10px 14px; }
.decisions .lock { padding: 3px 10px; font-size: 13px; }
.tchip.locked { color: var(--muted); text-decoration: none; }
.acct-plan { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 14.5px; }
.pro-page { max-width: 820px; }
.pro-hero h2 { font-size: 32px; margin-top: 2px; }
.pro-hero p { margin: 8px 0 0; font-size: 16px; max-width: 62ch; }
.pro-hero .label { color: var(--gold); }
.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.plan { position: relative; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.plan p { margin: 0 0 6px; }
.plan.best { border: 2px solid var(--accent); box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 15%, transparent); }
.plan-tag { position: absolute; top: -10px; right: 14px; background: var(--surface); }
.price { font-size: 40px; line-height: 1; }
.price span { font-size: 15px; color: var(--muted); font-family: var(--font-body); font-weight: 400; }
.plan .btn { margin-top: auto; padding: 10px 14px; }
.pro-feats { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pro-feats li { display: flex; flex-direction: column; padding-left: 26px; position: relative; }
.pro-feats li::before { content: "✓"; position: absolute; left: 2px; top: 0; color: var(--good); font-weight: 700; }
@media (max-width: 600px) { .plans { grid-template-columns: minmax(0, 1fr); } .pro-hero h2 { font-size: 26px; } .lock-cta { margin-left: 0; } }
/* Team Grade and Benny's Moves */
.gm-row { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 2fr); gap: 12px; align-items: start; }
.grade-card { padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.gc-letter { grid-row: span 2; width: 64px; height: 64px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 34px; border: 1px solid var(--line); }
.gc-score { font-size: 30px; line-height: 1; }
.gc-pos { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.moves-card { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.mv-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.mv { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 0; }
.mv + .mv { border-top: 1px solid var(--line); }
.mv-n { font-size: 20px; color: var(--accent); line-height: 1.2; }
.mv-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mv-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.mv-gain { color: var(--good); font-size: 17px; white-space: nowrap; }
@media (max-width: 780px) { .gm-row { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 600px) { .mv { grid-template-columns: 20px minmax(0, 1fr); } .mv-side { grid-column: 2; flex-direction: row; align-items: center; justify-content: space-between; } }
/* Ad slot and footer */
.adslot { min-height: 100px; display: flex; flex-direction: column; justify-content: center; }
.adslot .ad-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.adslot ins { min-height: 90px; }
.house { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: color-mix(in srgb, var(--gold) 5%, var(--surface)); color: var(--ink); text-decoration: none; }
.house .ad-label { flex-basis: 100%; color: var(--gold); }
.house strong { font-size: 16px; }
.house .btn { margin-left: auto; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); }   /* kept at the bottom of the page on short pages */
.foot a { color: var(--muted); }
body.welcome .adslot { display: none !important; }
/* Welcome walkthrough: the main tabs stay, so a visitor can look around first; the team tools wait for a team */
body.welcome .controls, body.welcome #teampin, body.welcome #teamctx, body.welcome #panels, body.welcome #brief, body.welcome #msgs, body.welcome #fresh { display: none !important; }
/* on the welcome, Sign in sits top right in the header (only that button), in place of the link above the headline */
body.welcome.wsign .top { align-items: center; }
body.welcome.wsign .top > .controls { display: flex !important; }
body.welcome.wsign .top #status, body.welcome.wsign .top [data-act="reload"], body.welcome.wsign #proBtn, body.welcome.wsign .wl-top { display: none !important; }
body.welcome.wsign #acctBtn { margin-left: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
body.welcome.wsign #acctBtn:hover, body.welcome.wsign #acctBtn[aria-expanded="true"] { background: color-mix(in srgb, var(--accent) 85%, var(--ink)); border-color: color-mix(in srgb, var(--accent) 85%, var(--ink)); color: var(--accent-ink); }

}

/* the team bar for a visitor with no team: what a team adds, and the way to add one */

.wl-methods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
/* each card in its platform's colors (Sleeper navy, ESPN red); Find your players in Benny's green */
.wl-method { --wl-bg: #075b37; --wl-fg: #ffffff; --wl-ico: #ffffff; position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px 44px 18px 16px; text-align: left; color: var(--wl-fg); border: 1px solid color-mix(in srgb, var(--wl-bg) 70%, #000); border-radius: var(--radius);
  background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--wl-bg) 80%, #fff) 0%, transparent 60%), linear-gradient(150deg, var(--wl-bg) 35%, color-mix(in srgb, var(--wl-bg) 72%, #000) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 1px 2px rgba(0, 0, 0, .12), 0 4px 12px color-mix(in srgb, var(--wl-bg) 25%, transparent); transition: box-shadow .2s, transform .2s; }

.wl-method.wl-espn { --wl-bg: #b0000b; --wl-fg: #ffffff; --wl-ico: #ffffff; }

.wl-method:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 2px 4px rgba(0, 0, 0, .12), 0 10px 24px color-mix(in srgb, var(--wl-bg) 40%, transparent); transform: translateY(-2px); }
.wl-method:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* the card's icon again, large and faint in the corner, and an arrow that nudges forward on hover */

@media (prefers-reduced-motion: reduce) { .wl-method, .wl-mark, .wl-go { transition: none; } .wl-method:hover, .wl-method:hover .wl-mark, .wl-method:hover .wl-go { transform: none; } }
/* the moving gradient and glass lens (assets/fx.js, WebGPU only): over the CSS gradient, under the icon and words */

.wl-ico { flex: none; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--wl-fg) 14%, transparent); color: var(--wl-ico); }

.wl-loading { align-items: flex-start; }

@media (max-width: 680px) { .wl-methods { grid-template-columns: minmax(0, 1fr); grid-auto-rows: 1fr; } .wl-method { flex-direction: row; align-items: center; gap: 12px; padding: 12px 44px 12px 14px; } .wl-go { top: 50%; margin-top: -10px; } .wl-mark { right: 24px; bottom: -34px; } .wl-mark svg { width: 96px; height: 96px; } }

/* Summary strip */

.flow-title.m-espn { --wl-tint: var(--espn-tint); --wl-ink: var(--espn-ink); }

/* Fantasy team headers */

/* Lineup rows */
.list { display: flex; flex-direction: column; }

/* PlayerIdentity: the player's picture to the left of his name and position. Fixed sizes, so nothing shifts as images load. */

.pimg { --pimg: 44px; flex: none; width: var(--pimg); height: var(--pimg); border-radius: 50%; overflow: hidden; background: var(--surface-2); color: color-mix(in srgb, var(--muted) 45%, var(--surface-2)); display: grid; place-items: end center; }

}
/* Detail */
.detail { padding: 4px 14px 16px 80px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
.factors { display: flex; flex-direction: column; gap: 9px; }

.fbar { position: relative; height: 10px; background: var(--surface-2); border-radius: 3px; }
.fbar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.fbar span { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.fbar .pos { left: 50%; background: var(--good); }

.fv { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }

/* The three models side by side (modelCompare): Trained's likely range as a band, a tick for Trained, a diamond for Classic and a dot for Sleeper */
.mcmp { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mcmp svg { display: block; width: 100%; max-width: 340px; height: 40px; overflow: visible; }
.mcmp .ax { stroke: var(--line); stroke-width: 1; }
.mcmp .band { fill: color-mix(in srgb, var(--accent) 22%, transparent); }
.mcmp .mt { stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; }
.mcmp .mc { fill: var(--warn); stroke: var(--surface); stroke-width: 1.5; }
.mcmp .ms { fill: var(--muted); stroke: var(--surface); stroke-width: 1.5; }
.mcmp-k { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 13.5px; font-variant-numeric: tabular-nums; }

/* Tables */
.tscroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--surface); position: sticky; top: 0; }
th[data-sort] { cursor: pointer; }
th[data-sort]:hover { color: var(--ink); }
td:first-child, th:first-child, td.l, th.l { text-align: left; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.spark { display: inline-block; vertical-align: middle; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.spark .area { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: none; }
.spark circle { fill: var(--accent); }
/* Teams & schemes: the open team's row stands out and the rest step back */
table.teams > tbody > tr.sel > td, table.teams > tbody > tr.seldet > td { background: color-mix(in srgb, var(--accent) 7%, var(--surface-2)); }
table.teams > tbody > tr.sel > td { border-bottom-color: transparent; }

table.teams > tbody > tr.sel .spark { display: none; }   /* the open table below draws the full trend */
/* the open team's season table, with each stat's trend drawn behind its season cells */
/* league power rankings: the grade badge inline with its score; your team marked like an open team row */
.lgp { display: flex; flex-direction: column; gap: 10px; }
table.lgt td { vertical-align: middle; font-size: 14px; }
table.lgt td:first-child { width: 36px; font-size: 17px; color: var(--accent); }
table.lgt .grade { display: inline-grid; width: 30px; height: 26px; font-size: 16px; vertical-align: middle; margin-right: 4px; }
table.lgt tr.me > td { background: color-mix(in srgb, var(--accent) 7%, var(--surface-2)); }
table.lgt tr.me > td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
table.lgt tr:last-child > td { border-bottom: 0; }
.gc-league { grid-column: 1 / -1; justify-self: start; margin-top: 4px; }
table.tdet { table-layout: fixed; min-width: 600px; }
table.tdet th:first-child { width: 22%; }
table.tdet td { padding-top: 12px; padding-bottom: 12px; border-bottom-color: color-mix(in srgb, var(--ink) 18%, var(--line)); }
table.tdet th:not(:first-child), table.tdet td:not(:first-child) { text-align: center; }
.tgc { position: relative; }
.tgc > span { position: relative; text-shadow: 0 0 3px var(--surface), 0 0 6px var(--surface); }
.tg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }

.tg polyline { fill: none; stroke: color-mix(in srgb, var(--accent) 60%, transparent); stroke-width: 1.5; }
.tgd { position: absolute; left: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--accent); opacity: .8; }
table.teams.has-sel > tbody > tr.click:not(.sel) .spark { opacity: .35; filter: grayscale(1); transition: opacity .15s, filter .15s; }
table.teams.has-sel > tbody > tr.click:not(.sel):hover .spark { opacity: 1; filter: none; }
.trend-up { color: var(--good); }
.trend-down { color: var(--bad); }

/* Compare */
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cmp .card { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.fasetup { padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.fa-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; font-size: 14.5px; }
.wbest { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; border: 1.8px solid var(--accent); }
.wbest .label { color: var(--gold); font-size: 14.3px; }
/* the Best move card's text runs 10% larger than the rest of the page (the shared-move card keeps the base sizes) */

  const H = histAll();
  for (const [k, s] of Object.entries(H)) {
    const [team, season, week] = k.split('|'); if (team !== state.activeTeam || !weekDone(+season, +week)) continue;
    const ids = [...(s.starters || []).map(e => e[1]), ...(s.bench || []).map(e => e[0])].filter(Boolean);
    const add = {}; for (const id of ids) if (!ok(s.act?.[id])) { const p = histPts(s, +season, +week, id); if (ok(p)) add[id] = Math.round(p * 10) / 10; }
    if (Object.keys(add).length) histPut(k, Object.assign({}, s, { act: Object.assign({}, s.act, add), savedAt: Date.now() }));
  }
}
function histPanel() {
  gradeHist();
  const ct = curTeam(), H = histAll();
  const weeks = Object.entries(H).filter(([k]) => k.startsWith(state.activeTeam + '|')).map(([k, s]) => { const [, season, week] = k.split('|'); return { k, s, season: +season, week: +week }; })
    .sort((a, b) => b.season - a.season || b.week - a.week);
  const signIn = acct.on && !acct.user ? ` <button type="button" class="linkbtn" data-act="account">Sign in</button> to keep them on all your devices.` : '';
  const head = `<div class="row-head"><h2>Past weeks <span class="hsub">${esc(ct?.name || '')}</span></h2><button type="button" class="btn sm" data-act="hist">Close</button></div>`;
  if (!weeks.length) return `<div class="card panel hist">${head}<p class="small muted" style="margin:0">Benny saves this team’s lineup each week you open Lineup, then fills in what every player scored. Check back after this week’s games.${signIn}</p></div>`;
  const label = w => `Week ${w.week}${w.season !== D.detSeason ? ` · ${w.season}` : ''}`;
  const rows = weeks.map(w => {
    const st = (w.s.starters || []).filter(e => e[1]), proj = st.reduce((t, e) => t + (e[4] || 0), 0), pts = st.map(e => histPts(w.s, w.season, w.week, e[1]));
    const known = pts.filter(ok), done = weekDone(w.season, w.week), tot = known.reduce((t, x) => t + x, 0);
    const scored = done && known.length ? f1(tot) : known.length ? `${f1(tot)} <span class="muted">so far</span>` : '—';
    const diff = done && known.length ? `<span class="${tot >= proj ? 'trend-up' : 'trend-down'}">${tot >= proj ? '+' : '−'}${f1(Math.abs(tot - proj))}</span>` : '';
    const open = D.histWeek === w.k;
    const detail = open ? `<tr class="hdet"><td colspan="4"><table><thead><tr><th class="l">Slot</th><th class="l">Player</th><th>Proj</th><th>Pts</th></tr></thead><tbody>
      ${(w.s.starters || []).map(e => `<tr><td class="l"><span class="slot">${esc(SLOT_TYPES.find(t => t.k === e[0])?.label || e[0])}</span></td><td class="l">${e[1] ? `${esc(e[2])} <span class="muted">${esc(e[3])}</span>` : '<span class="muted">Empty</span>'}</td><td>${e[1] ? f1(e[4]) : ''}</td><td>${e[1] ? f1(histPts(w.s, w.season, w.week, e[1])) : ''}</td></tr>`).join('')}
      ${(w.s.bench || []).map(e => `<tr class="hbench"><td class="l"><span class="slot bench">BN</span></td><td class="l">${esc(e[1])} <span class="muted">${esc(e[2])}</span></td><td>${f1(e[3])}</td><td>${f1(histPts(w.s, w.season, w.week, e[0]))}</td></tr>`).join('')}
      </tbody></table><div class="small muted">${esc(w.s.fmt || '')} · saved ${esc(new Date(w.s.savedAt).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}</div></td></tr>` : '';
    return `<tr class="click" data-hweek="${esc(w.k)}" aria-expanded="${open}"><td class="l"><strong>${label(w)}</strong></td><td>${f1(proj)}</td><td>${scored}</td><td>${diff}</td></tr>${detail}`;
  }).join('');
  return `<div class="card panel hist">${head}<p class="small muted" style="margin:0">Benny’s lineup for each week, what it projected and what it scored. Tap a week for every player.${signIn}</p>
    <div class="tscroll"><table><thead><tr><th class="l">Week</th><th>Projected</th><th>Scored</th><th title="Scored minus projected">+/−</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ---------- coaches (ESPN head-coach check, cached 24h) ---------- */
async function checkCoaches(season) {
  const key = 'coach:' + season, c = store.get(key);
  if (c && Date.now() - c.ts < 864e5) { D.coaches = c.data; if (state.tab === 'teams') render(); return; }
  const idFrom = j => { const ref = j?.items?.[0]?.$ref || ''; const m = /coaches\/(\d+)/.exec(ref); return m ? { id: m[1], ref: ref.replace(/^http:/, 'https:') } : null; };
  const res = await pool(ABBR, 6, async T => {
    const tid = TEAMS[T][0];
    const [now, prev] = await Promise.all([fetchJSON(API.coaches(season, tid)).catch(() => null), fetchJSON(API.coaches(season - 1, tid)).catch(() => null)]);
    const a = idFrom(now), b = idFrom(prev); if (!a) return null;
    const doc = await fetchJSON(a.ref).catch(() => null);
    return [T, { name: doc ? `${doc.firstName} ${doc.lastName}` : null, isNew: b ? a.id !== b.id : null }];
  });
  const data = Object.fromEntries(res.filter(Boolean));
  if (Object.keys(data).length) { D.coaches = data; store.set(key, { ts: Date.now(), data }); if (state.tab === 'teams') render(); }
}

    D.espnMsg = D.espnTeams.length ? ['info', `Found ${D.espnTeams.length} teams. Pick yours and press Use this team.`] : ['err', 'ESPN returned no teams for that league and season.'];

/* ---------- Sleeper league sync ----------
   Sleeper's API is public (no login) and uses the same player ids as the projections, so a linked team copies its
   roster, lineup slots, scoring and league size exactly, and every rostered player in the league is known, which
   gives the Waiver Optimizer the league's real free agents. Linked teams re-sync when the page loads. */
const SL = 'https://api.sleeper.app/v1';
const SL_SLOT = { QB: 'QB', RB: 'RB', WR: 'WR', TE: 'TE', FLEX: 'FLEX', WRRB_FLEX: 'RB/WR', REC_FLEX: 'WR/TE', SUPER_FLEX: 'OP', K: 'K', DEF: 'D/ST' };
function slScoring(ss) { const rec = +(ss?.rec ?? 1); return { scoring: rec >= 0.75 ? 'ppr' : rec >= 0.25 ? 'half' : 'std', tePrem: Math.max(0, +(ss?.bonus_rec_te || 0)) }; }
// league settings Benny doesn't model, so the sync can say so plainly
function slNotes(lg) {
  const ss = lg.scoring_settings || {}, n = [];
  if (+ss.pass_td && +ss.pass_td !== 4) n.push(`${ss.pass_td}-point passing TDs`);
  if (+ss.bonus_rec_rb || +ss.bonus_rec_wr) n.push('RB or WR catch bonuses');
  if (+ss.rush_fd || +ss.rec_fd) n.push('first-down points');
  if ((lg.roster_positions || []).some(p => /^(DL|LB|DB|IDP)/.test(p))) n.push('individual defensive players');
  return n;
}
// a league's lineup slots, scoring and size
function slSettings(lg, rosters) {
  const slots = Object.fromEntries(SLOT_TYPES.map(t => [t.k, 0])); for (const p of lg.roster_positions || []) if (SL_SLOT[p]) slots[SL_SLOT[p]]++;
  const sc = slScoring(lg.scoring_settings);
  return { slots, scoring: sc.scoring, tePrem: sc.tePrem, size: lg.total_rosters || rosters.length };
}
// each roster's team: its name in the league (or the owner's), and the owner
function slTeams(rosters, users) {
  const byUser = Object.fromEntries((users || []).map(u => [u.user_id, u]));
  return rosters.map(r => { const u = byUser[r.owner_id]; return { rosterId: r.roster_id, ownerId: r.owner_id, name: u?.metadata?.team_name || u?.display_name || `Team ${r.roster_id}`, owner: u?.display_name || 'no owner', n: (r.players || []).length }; });
}
function slApply(lg, rosters, rosterId) {
  const r = rosters.find(x => String(x.roster_id) === String(rosterId)); if (!r) return null;
  const taxi = new Set(r.taxi || []);
  return Object.assign(slSettings(lg, rosters), { roster: (r.players || []).filter(id => !taxi.has(id)),
    rostered: rosters.flatMap(x => x.players || []), starters: (r.starters || []).filter(id => id && id !== '0'),
    // exact roster size: every lineup and bench spot (IR and taxi spots are extra)
    rosterMax: (lg.roster_positions || []).filter(p => p !== 'IR').length, reserve: (r.reserve || []).filter(id => !taxi.has(id)) });
}
async function slFind() {
  const q = ($('#slQuery')?.value || '').trim(); D.sl = { q, msg: null };
  if (!q) { D.sl.msg = ['err', 'Enter your Sleeper username or a league ID.']; return render(); }
  D.sl.msg = ['info', 'Looking up Sleeper…']; flowTry(); render();
  try {
    if (/^\d{8,}$/.test(q)) return await slLoadLeague(q);
    const u = await fetchJSON(`${SL}/user/${encodeURIComponent(q)}`);
    if (!u?.user_id) { flowFail('user_not_found'); D.sl.msg = ['err', `No Sleeper user named “${q}”. Check the spelling, or paste a league ID instead.`]; return render(); }
    const ls = await fetchJSON(`${SL}/user/${u.user_id}/leagues/nfl/${D.season}`);
    D.sl.userId = u.user_id; D.sl.leagues = (ls || []).map(l => ({ id: l.league_id, name: l.name, size: l.total_rosters }));
    if (!D.sl.leagues.length) { flowFail('no_leagues'); D.sl.msg = ['err', `${u.display_name} has no ${D.season} leagues on Sleeper.`]; return render(); }
    if (D.sl.leagues.length === 1) return await slLoadLeague(D.sl.leagues[0].id);
    D.sl.msg = ['info', `Found ${D.sl.leagues.length} leagues. Pick one.`]; render();
  } catch { flowFail('network'); D.sl.msg = ['err', 'Couldn’t reach Sleeper. Try again in a moment.']; render(); }
}
async function slLoadLeague(id) {
  D.sl = Object.assign(D.sl || {}, { msg: ['info', 'Loading league…'], league: null }); flowTry(); render();
  try {
    const [lg, ros, users] = await Promise.all([fetchJSON(`${SL}/league/${id}`), fetchJSON(`${SL}/league/${id}/rosters`), fetchJSON(`${SL}/league/${id}/users`)]);
    if (!lg?.league_id) { flowFail('league_not_found'); D.sl.msg = ['err', 'No Sleeper league with that ID.']; return render(); }
    D.sl.league = lg; D.sl.rosters = ros || [];
    D.sl.teams = slTeams(D.sl.rosters, users);
    D.lg[lg.league_id] = { lg, rosters: D.sl.rosters, users: users || [], at: Date.now() };   // the same data the power rankings use
    D.sl.pick = (D.sl.teams.find(t => t.ownerId === D.sl.userId) || D.sl.teams[0])?.rosterId;
    D.sl.msg = lg.season !== String(D.season) ? ['err', `That league is from the ${lg.season} season; Benny is set to ${D.season}.`] : ['info', `${lg.name}: pick your team and press Sync this team.`];
    if (lg.season !== String(D.season)) flowFail('wrong_season');
  } catch { flowFail('network'); D.sl.msg = ['err', 'Couldn’t reach Sleeper. Try again in a moment.']; }
  render();
}

/* Re-sync every linked team (rosters, slots, scoring, league-wide rostered players). Quiet on failure: the last sync stays. */
async function slAutoSync(force) {
  stashTeam();
  const linked = state.teams.filter(t => t.sleeper?.leagueId); if (!linked.length) return;
  const byLeague = {}; for (const t of linked) (byLeague[t.sleeper.leagueId] = byLeague[t.sleeper.leagueId] || []).push(t);
  D.slSyncing = true; renderSyncLine();
  for (const [lid, teams] of Object.entries(byLeague)) {
    if (!force && teams.every(t => Date.now() - (t.sleeper.syncedAt || 0) < 5 * 60000)) continue;
    try {
      const [lg, ros] = await Promise.all([fetchJSON(`${SL}/league/${lid}`), fetchJSON(`${SL}/league/${lid}/rosters`)]);
      if (!lg?.league_id || !Array.isArray(ros)) continue;
      for (const t of teams) {
        const a = slApply(lg, ros, t.sleeper.rosterId); if (!a) continue;
        Object.assign(t, { roster: a.roster, slots: a.slots, scoring: a.scoring, tePrem: a.tePrem });
        t.sleeper = Object.assign({}, t.sleeper, { rostered: a.rostered, starters: a.starters, rosterMax: a.rosterMax, reserve: a.reserve, syncedAt: Date.now(), leagueName: lg.name, notes: slNotes(lg) });
        t.waivers = Object.assign({}, t.waivers, { teams: a.size });
      }
    } catch {}
  }
  D.slSyncing = false;
  applyTeam(curTeam()); D.wCache = null; save(); syncScoring(); render();
}

function useEspnTeam() {
  const t = (D.espnTeams || []).find(t => String(t.id) === String(state.espn.teamId)); if (!t) return;
  const ids = [], missed = [], slotOf = {};
  for (const e of t.entries) {
    const p = e.playerPoolEntry?.player || {}, pos = ESPN_POS[p.defaultPositionId], team = ESPN_TO_ABBR[p.proTeamId];
    let id = null;
    if (pos === 'DEF') id = team || null;

}

/* ---------- rendering ---------- */
/* Start/sit calls worth a second look: a starter whose best eligible bench player has at least a 38% chance of
   outscoring him, or a starter tagged questionable or doubtful. Closest calls first. */
const shortName = id => { const u = D.U.get(id); return !u ? '' : u.pos === 'DEF' ? (TEAMS[u.team]?.[1] || u.team) : u.name.split(' ').slice(-1)[0]; };
const pBeats = (a, b) => (a.sd || b.sd) ? Phi((a.mean - b.mean) / Math.sqrt(a.sd ** 2 + b.sd ** 2)) : (a.mean >= b.mean ? 1 : 0);
function reviewDecisions() {
  if (!state.roster.length || !D.M) return [];
  const { starters, bench } = optimize(), out = [];
  const alts = bench.filter(r => r.status === 'ok' && !r.locked);
  for (const s of starters) {
    const st = s.r; if (!st || st.locked) continue;
    const alt = alts.filter(b => s.slot.elig.includes(b.pos)).sort((x, y) => y.mean - x.mean)[0];
    const tagged = /^(questionable|doubtful)/i.test(st.inj || '');
    if (!alt) continue;
    const p = pBeats(alt, st);
    if (p >= 0.38 || tagged) out.push({ start: st.id, alt: alt.id, slot: s.slot.label || s.slot.k, p, tagged });
  }
  const seen = new Set();
  return out.filter(d => !seen.has(d.alt) && seen.add(d.alt)).sort((a, b) => b.p - a.p);
}
/* ---------- Team Grade ----------
   Each starter is ranked against every player at his position on season-long value (rosBase, so one matchup doesn't
   swing it), the same ranking Waivers uses for team needs. A starter who ranks like an elite starter in a league this
   size scores 100, a league-average starter about 70, and it drops from there. Kickers and defenses count less, good
   bench depth at RB/WR/TE adds a little, and the total is out of 100 with a letter grade. */
const GRADE_CUTS = [[93, 'A+'], [87, 'A'], [83, 'A−'], [79, 'B+'], [75, 'B'], [71, 'B−'], [67, 'C+'], [63, 'C'], [59, 'C−'], [55, 'D+'], [50, 'D'], [0, 'F']];
const POS_WEIGHT = { QB: 1, RB: 1, WR: 1, TE: 0.8, K: 0.3, DEF: 0.4 };
function teamGrade() {
  if (!state.roster.length || !D.M) return null;
  return gradeOf(computeWaivers().needs.list);
}
// the grade from each position's rows (posRows), in the current lineup slots and league size
function gradeOf(list) {
  const L = state.waivers.teams || 12, per = {};
  let sum = 0, wsum = 0, depth = 0;
  for (const n of list) {
    const need = Math.max(1, Math.round(posSlots(n.P))), share = posSlots(n.P) / need, w = POS_WEIGHT[n.P] ?? 1, scores = [];
    for (let i = 0; i < need; i++) {
      const r = n.rows[i], avgRank = L * (i + 0.5) * share, ratio = r && r.rank && !r.away ? r.rank / avgRank : 4;
      scores.push(ratio <= 1 ? 100 - 30 * Math.max(0, ratio - 0.3) / 0.7 : Math.max(15, 70 - 30 * (ratio - 1)));
    }
    const s = mean(scores); per[n.P] = Math.round(s); sum += s * w * need; wsum += w * need;
    // a bench player who'd start for many teams is real injury cover
    if (['RB', 'WR', 'TE'].includes(n.P)) for (const r of n.rows.slice(need)) if (r.rank && r.rank <= L * (need + 1) * share) depth++;
  }
  if (!wsum) return null;
  const score = clamp(Math.round(sum / wsum + Math.min(4, depth)), 0, 100), letter = GRADE_CUTS.find(([c]) => score >= c)[1];
  const main = Object.entries(per).filter(([P]) => P !== 'K' && P !== 'DEF').sort((a, b) => b[1] - a[1]);
  return { score, letter, per, best: main[0]?.[0], worst: main.length > 1 ? main[main.length - 1][0] : null };
}
const gradeClass = l => l[0] === 'A' ? 'A' : l[0] === 'B' ? 'B' : l[0] === 'C' ? 'C' : l[0] === 'D' ? 'D' : 'F';
const posLabel = P => P === 'DEF' ? 'D/ST' : P;
function gradeCard() {
  const g = teamGrade(); if (!g) return '';
  return `<div class="card grade-card"><span class="gc-letter g-${gradeClass(g.letter)}" aria-hidden="true">${g.letter}</span>
    <div class="gc-main"><span class="label">Benny Grade</span><div><span class="num gc-score">${g.score}</span><span class="muted">/100</span> <span class="vh">${g.letter}</span></div>
      <div class="small muted">${g.best ? `Strongest: <strong>${posLabel(g.best)}</strong>` : ''}${g.worst && g.worst !== g.best ? ` · Weakest: <strong>${posLabel(g.worst)}</strong>` : ''}</div></div>
    <div class="gc-pos">${Object.entries(g.per).map(([P, s]) => `<span class="chip ${s >= 80 ? 'up' : s < 55 ? 'down' : ''}" title="${posLabel(P)} starters score ${s}/100">${posLabel(P)} ${s}</span>`).join('')}</div>
    ${state.sleeper?.leagueId ? `<button type="button" class="btn sm gc-league" data-act="league" aria-expanded="${!!D.lgOpen}">${D.lgOpen ? 'Hide' : 'See'} your league’s power rankings</button>` : ''}</div>`;
}
/* Your weakest spot: the QB, RB, WR or TE group with the lowest Benny Grade score, and the free agents there most worth
   adding. Candidates come from the Waivers pool (players available in most leagues, or your league's own free agents),
   best usual week first, each against the weakest starter you have there. Marking one Taken skips him and the next
   moves up. */
function weakSpot(n = 5) {
  const g = teamGrade(); if (!g?.worst) return null;
  const R = computeWaivers(), P = g.worst, vs = id => R.VS[id]?.[0] ?? 0;
  const st = (R.needs.list.find(x => x.P === P)?.rows || []).filter(r => r.starter).map(r => r.id);
  const mine = st.length ? st.reduce((a, b) => vs(b) < vs(a) ? b : a) : null;
  const picks = R.pool.filter(id => D.U.get(id).pos === P).sort((a, b) => vs(b) - vs(a)).slice(0, n)
    .map(id => ({ id, val: vs(id), gain: vs(id) - (mine ? vs(mine) : 0) }));
  return { P, score: g.per[P], mine, mineVal: mine ? vs(mine) : 0, picks };
}
// how likely a free agent is to be on your league's waiver wire, from the same source the Waivers pool uses
function availTxt(id) {
  const W = state.waivers;
  if (W.source === 'sleeper' && state.sleeper?.rostered) return 'free agent in your league';
  if (W.source === 'list' && W.faList.length) return 'on your league’s free-agent list';
  if (!D.own.size) return '';
  const o = D.own.get(id) ?? 0; return `available in ${o < 1 ? '99%+' : Math.round(100 - o) + '%'} of leagues`;
}

/* ---------- league power rankings ----------
   Every roster in a Sleeper league graded with Benny Grade (gradeOf) in that league's lineup slots and size, best first,
   with each team's record. Sleeper's league data is public, so this needs no login. A Sleeper-linked team opens it from
   its grade card; a shared rankings link (?league=, shareLeague) opens it for anyone, and a visitor with no team picks
   their own team from the list to set it up. */
async function fetchLeague(lid, force) {
  const c = D.lg[lid]; if (!force && c?.lg && Date.now() - c.at < 5 * 60000) return c;
  try {
    const [lg, rosters, users] = await Promise.all([fetchJSON(`${SL}/league/${lid}`), fetchJSON(`${SL}/league/${lid}/rosters`), fetchJSON(`${SL}/league/${lid}/users`)]);
    if (!lg?.league_id || !Array.isArray(rosters) || !rosters.length) return (D.lg[lid] = { err: 'missing' });
    return (D.lg[lid] = { lg, rosters, users: users || [], at: Date.now() });
  } catch { return (D.lg[lid] = { err: 'network' }); }
}
/* The league's teams, best grade first: { rid, name, owner, w, l, t, g } (g: gradeOf, null with no players this week).
   The user's own team grades exactly as on Lineup, since it's the same rows over the same window. Kept until the data,
   settings or league change. */
function leagueRanks(L) {
  const key = JSON.stringify([L.lg.league_id, L.at, D.loadedAt?.getTime(), D.week, fmtKey(), state.settings, state.overrides, state.returnWeek, state.staffEdits, state.waivers.horizon]);
  if (L.ranks?.key === key) return L.ranks.rows;
  const s = slSettings(L.lg, L.rosters), keep = [state.slots, state.waivers.teams];
  state.slots = s.slots; state.waivers.teams = s.size;   // gradeOf and posSlots read the league's setup from state
  try {
    const { mid } = waiverWindow(), Ps = POS.filter(P => posSlots(P) > 0), ranks = Object.fromEntries(Ps.map(P => [P, posRanks(P)]));
    const teams = slTeams(L.rosters, L.users);
    const rows = L.rosters.map((r, i) => {
      const taxi = new Set(r.taxi || []), ids = (r.players || []).filter(id => !taxi.has(id) && D.M[id]), st = r.settings || {};
      return { rid: r.roster_id, name: teams[i].name, owner: teams[i].owner, w: +st.wins || 0, l: +st.losses || 0, t: +st.ties || 0,
        g: ids.length ? gradeOf(Ps.map(P => ({ P, rows: posRows(ids, P, ranks[P], mid).rows }))) : null };
    }).sort((a, b) => (b.g?.score ?? -1) - (a.g?.score ?? -1) || (b.w - b.l) - (a.w - a.l));
    L.ranks = { key, rows };
    return rows;
  } finally { [state.slots, state.waivers.teams] = keep; }
}
const recordTxt = r => r.w || r.l || r.t ? `${r.w}-${r.l}${r.t ? '-' + r.t : ''}` : '—';
function leagueTable(L, mine) {
  const rows = leagueRanks(L);

    ${rows.map((r, i) => `<tr${String(r.rid) === String(mine) ? ' class="me"' : ''}><td class="num">${r.g ? i + 1 : '—'}</td>
      <td class="l"><strong>${esc(r.name)}</strong>${r.owner && r.owner !== r.name && r.owner !== 'no owner' ? ` <span class="small muted">${esc(r.owner)}</span>` : ''}${String(r.rid) === String(mine) ? ' <span class="pill n">You</span>' : ''}</td>
      <td>${r.g ? `<span class="grade g-${gradeClass(r.g.letter)}">${r.g.letter}</span> <span class="num">${r.g.score}</span>` : '<span class="muted">—</span>'}</td>
      <td class="num">${recordTxt(r)}</td>
      <td class="l small">${r.g ? `${r.g.best ? posLabel(r.g.best) : ''}${r.g.worst && r.g.worst !== r.g.best ? ` · <span class="muted">${posLabel(r.g.worst)}</span>` : ''}` : '<span class="muted">No players this week</span>'}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="small muted" style="margin:0">Each roster’s Benny Grade, out of 100: its starters ranked against every player at their position on rest-of-season value, in this league’s lineup and size. It rates roster strength now, not the record so far.</p>`;

// a league's data, fetched once while it's missing (the panel can open on a team whose league isn't loaded yet), then a render

/* ---------- player search (Roster and Find your players) ----------
   Suggests as you type from every player, whatever list is showing, with position, team and roster status. */
function acMatches(q) {
  q = norm(q); if (q.length < 2) return [];
  // an exact team code ("dal") lists that team's players first; otherwise name matches rank by where they match
  const teamCode = ABBR.find(a => a.toLowerCase() === q), out = [];
  for (const u of D.U.values()) {
    if (!D.M[u.id] && !D.prevPPG?.[u.id]) continue;
    const n = norm(u.name), i = n.indexOf(q), last = n.split(' ').slice(-1)[0];
    const teamHit = (u.team || '').toLowerCase() === q || (u.pos === 'DEF' && TEAMS[u.team] && (norm(TEAMS[u.team][1]).startsWith(q) || norm(TEAM_CITY[u.team] + ' ' + TEAMS[u.team][1]).startsWith(q) || teamOf(q) === u.team));
    if (i < 0 && !teamHit) continue;
    out.push([(teamCode && u.team === teamCode ? 400 : i === 0 ? 300 : last.startsWith(q) ? 200 : i > 0 ? 100 : 50) + (D.M[u.id]?.mean || 0), u]);
  }
  return out.sort((a, b) => b[0] - a[0]).slice(0, 8).map(x => x[1]);
}
// each player search box: its suggestion list, and what picking a suggestion does
const AC_BOX = { addq: ['acList', 'roster'], mq: ['mqList', 'manual'], cmp0: ['cmpList0', 'cmp0'], cmp1: ['cmpList1', 'cmp1'], pq: ['pqList', 'open'] };
const isCmpBox = id => id === 'cmp0' || id === 'cmp1';
// Start / Sit: an empty box lists your roster (best projection first, minus the other side's player); with no team yet,
// this week's top projections at the other player's position (every position when that side is empty)
function cmpRoster(k) {
  const other = D.cmpShown?.[1 - k];
  if (!state.roster.length) { const P = D.M[other]?.pos; return Object.values(D.M).filter(r => r.status === 'ok' && r.id !== other && (!P || r.pos === P)).sort((a, b) => b.mean - a.mean).slice(0, 12).map(r => r.u); }
  return state.roster.map(id => D.U.get(id)).filter(u => u && D.M[u.id] && u.id !== other).sort((a, b) => D.M[b.id].mean - D.M[a.id].mean);
}

  D.ac = { input: inputId, items, idx: Math.max(0, Math.min(D.ac?.input === inputId ? D.ac.idx : 0, items.length - 1)) };

// typing survives repaints: the draft is kept as it's typed, and focus goes back to the box it was in
function talkRefocus() {

}

/* A person's page, #u/<username>: member since, how many comments are showing, and their latest 50 (hidden and deleted ones

    .then(async r => {

      if (cur.p) cur.rows = await sbRest(`comments?author_id=eq.${cur.p.user_id}&hidden_at=is.null&deleted_at=is.null&select=id,player_id,parent_id,body,season,week,created_at&order=created_at.desc&limit=50`) || [];
      cur.st = 'ok'; cur.at = Date.now();

  if (!e.p) return `<div class="section profile">${back}<div class="card panel"><h2>No such user</h2><p style="margin:0">Nobody has the username “${esc(h)}”. <a href="#players" data-tab="pool">Search players</a></p></div></div>`;

      <div class="cmt-body">${talkBody(c.body)}</div><div class="small"><a class="more-link" href="#${playerHash(id, 'talk')}">See the discussion →</a></div></article>`; }).join('');

    <div class="card panel"><h3 style="margin:0">Latest comments</h3>${rows || `<p class="small muted" style="margin:0">${own ? 'You haven’t commented yet. Find a player and add your take.' : 'No comments yet.'}</p>`}${e.rows.length >= 50 ? `<p class="small muted" style="margin:0">Showing the latest 50.</p>` : ''}</div></div>`;

/* Watching a player: his news joins your players' in the alerts. Kept with the shared settings, so it syncs. */
const watching = id => (state.watch || []).includes(id);
const watchBtn = id => `<button type="button" class="btn sm" data-watch="${esc(id)}" aria-pressed="${watching(id)}" title="${watching(id) ? 'Stop getting his news in your alerts' : 'Get his news in your alerts'}">${watching(id) ? '★ Watching' : '☆ Watch'}</button>`;
function toggleWatch(id) {
  const w = state.watch || (state.watch = []), i = w.indexOf(id), nm = D.U.get(id)?.name || 'this player';
  if (i >= 0) w.splice(i, 1); else { w.push(id); if (w.length > 200) w.shift(); }

/* The bell: news from the last week about your team's players and the players you watch, and replies in the threads
   you've posted in, since you last opened it (the first time, the last two days). */
const alertsSince = () => D.alertsSince ?? (state.alertsSeen || Date.now() - 2 * 864e5);
function alertItems() {
  const since = alertsSince(), ids = new Set([...(state.watch || []), ...state.roster]), wk = Date.now() - 7 * 864e5;
  const news = (D.news?.d?.items || []).filter(i => { const t = Date.parse(i.t); return t > since && t > wk && i.ids?.some(id => ids.has(id)); });
  const reps = (acct.replies || []).filter(c => Date.parse(c.created_at) > since);
  return { news, reps, n: news.length + reps.length };
}
async function alertsLoad() {
  if (!acct.user || !talkNet()) { acct.replies = []; return renderBell(); }
  const since = new Date(Math.max(state.alertsSeen || 0, Date.now() - 14 * 864e5)).toISOString();
  try { acct.replies = await sbRest('rpc/my_replies?select=id,player_id,parent_id,author_id,body,created_at,profiles(handle)', { method: 'POST', body: { since } }) || []; }
  catch (e) { talkMissing(e); }
  renderBell();
}
function renderBell() {

  b.hidden = !show; if (!show) return;
  if (D.news?.st === 'ok' && Date.now() - (D.news.at || 0) > 18e5 && !D.alertsOpen) D.news = null;   // the feed changes every 3 hours
  newsFeed();
  const { n } = alertItems(), c = b.querySelector('.bell-n');
  c.hidden = !n; c.textContent = n > 9 ? '9+' : String(n);

}
function toggleAlerts() {

function alertsPanel() {

/* #mod, for moderators (the database refuses everyone else whatever this page shows):
   - Reports, grouped by comment: hide it (with a reason, if you like), delete it, dismiss the reports, or ban its author;
   - Hidden comments: restore or delete;
   - Bans: who, why, and lifting one;
   - Log: the last 100 things moderators did (mod_log, written by the database). */
const MOD_TABS = [['reports', 'Reports'], ['hidden', 'Hidden'], ['bans', 'Bans'], ['log', 'Log']];
async function modLoad() {
  D.mod = { st: 'loading' };
  const cols = 'id,player_id,parent_id,author_id,body,hidden_at,hidden_reason,deleted_at,created_at,profiles(handle)';
  try {
    const [reps, hid, bans, log] = await Promise.all([
      sbRest('reports?select=id,target_id,reason,note,created_at&resolved_at=is.null&order=created_at.desc&limit=300'),
      sbRest(`comments?select=${cols}&hidden_at=not.is.null&hidden_reason=neq.__parent&order=hidden_at.desc&limit=100`),
      sbRest('rpc/list_bans', { method: 'POST', body: {} }),
      sbRest('mod_log?select=id,at,action,target_kind,target_id,note&order=at.desc&limit=100')]);
    // the comments the reports and the log are about, and the names of the accounts the log mentions
    const ids = [...new Set([...(reps || []).map(r => r.target_id), ...(log || []).filter(l => l.target_kind === 'comment').map(l => l.target_id)])];
    const users = [...new Set((log || []).filter(l => l.target_kind === 'user').map(l => l.target_id))];
    const [cs, ps] = await Promise.all([ids.length ? sbRest(`comments?select=${cols}&id=in.${encodeURIComponent(inList(ids))}`) : [],
      users.length ? sbRest(`profiles?select=user_id,handle&user_id=in.${encodeURIComponent(inList(users))}`) : []]);
    D.mod = { st: 'ok', reps: reps || [], cs: new Map((cs || []).map(c => [c.id, c])), hid: hid || [], bans: bans || [], log: log || [], names: new Map((ps || []).map(p => [p.user_id, p.handle])) };
  } catch (e) { D.mod = { st: 'err', msg: talkErr(e) }; }
  if (state.tab === 'mod') render();
}
function viewMod() {
  if (!acct.user || !acct.admin) return `<div class="card panel"><h2>Moderation</h2><p class="small muted" style="margin:0">This page is for moderators.${acct.user ? '' : ' Sign in first.'}</p></div>`;
  if (!D.mod) modLoad();
  const M = D.mod; if (!M || M.st === 'loading') return `<div class="card loading"><h3>Loading reports</h3></div>`;
  if (M.st === 'err') return `<div class="card panel"><h2>Moderation</h2><p>${esc(M.msg)}</p><button type="button" class="btn sm" data-modact="reload|">Try again</button></div>`;
  const tab = MOD_TABS.some(([k]) => k === D.modTab) ? D.modTab : 'reports';
  const who = c => `${talkWho(c)} on ${plink(c.player_id, esc(D.U.get(c.player_id)?.name || c.player_id))}`;
  const groups = new Map(); for (const r of M.reps) { if (!groups.has(r.target_id)) groups.set(r.target_id, []); groups.get(r.target_id).push(r); }
  const b = (act, id, l, cls = '') => `<button type="button" class="btn sm ${cls}" data-modact="${act}|${esc(id)}">${l}</button>`;
  // banning the author: a reason and whether to hide what they've posted, then Ban (one form open at a time)
  const bannable = c => c && !c.deleted_at && c.author_id && c.author_id !== acct.user.id;
  const banForm = c => `<div class="modban"><input class="inp" id="modBanWhy" maxlength="200" placeholder="Reason (only moderators see it)" aria-label="Reason for the ban"><label class="small"><input type="checkbox" id="modBanHide" checked> Hide everything they’ve posted</label>${b('ban', c.author_id, `Ban ${talkWho(c)}`, 'danger')}${b('banask', '', 'Cancel')}</div>`;
  const card = (c, body, btns) => `<div class="card panel modc"><div class="cmt-head">${c && !c.deleted_at ? who(c) : '<span class="muted">Deleted comment</span>'}${c ? `<span class="small muted">${ago(Date.parse(c.created_at))}</span>` : ''}${c?.hidden_at ? '<span class="pill o">Hidden</span>' : ''}</div>${c && !c.deleted_at ? `<div class="cmt-body">${esc(c.body)}</div>` : ''}${body}
    <div class="toolbar">${btns}${bannable(c) && D.modBan !== c.author_id ? b('banask', c.author_id, 'Ban the author…') : ''}</div>${bannable(c) && D.modBan === c.author_id ? banForm(c) : ''}</div>`;
  let list;
  if (tab === 'reports') list = [...groups].map(([tid, rs]) => {
    const c = M.cs.get(tid), why = Object.entries(rs.reduce((o, r) => (o[r.reason] = (o[r.reason] || 0) + 1, o), {})).map(([k, n]) => `${esc((REPORT_WHY.find(x => x[0] === k) || [k, k])[1])} ×${n}`).join(' · ');
    const live = c && !c.deleted_at && !c.hidden_at;
    return card(c, `<div class="small"><strong>${rs.length} report${rs.length === 1 ? '' : 's'}:</strong> ${why}${rs.filter(r => r.note).map(r => `<div class="small muted">“${esc(r.note)}”</div>`).join('')}</div>${live ? `<input class="inp" data-modwhy="${esc(tid)}" maxlength="200" placeholder="Reason for hiding (optional, only moderators see it)" aria-label="Reason for hiding">` : ''}`,
      (live ? b('hide', tid, 'Hide it', 'primary') : '') + (c ? b('del', tid, 'Delete it', 'danger') : '') + b('dismiss', tid, 'Dismiss the reports'));
  }).join('') || '<div class="card panel small muted">No open reports.</div>';
  else if (tab === 'hidden') list = M.hid.map(c => card(c, c.hidden_reason ? `<div class="small muted">${esc(c.hidden_reason === 'banned' ? 'Hidden with the account’s ban' : c.hidden_reason)}</div>` : '', b('restore', c.id, 'Restore') + b('del', c.id, 'Delete', 'danger'))).join('') || '<div class="card panel small muted">Nothing hidden.</div>';
  else if (tab === 'bans') list = M.bans.map(x => `<div class="card panel modc"><div class="cmt-head"><strong>${esc(x.handle || 'An account with no username')}</strong><span class="small muted">banned ${ago(Date.parse(x.created_at))}</span></div>${x.reason ? `<div class="small muted">${esc(x.reason)}</div>` : ''}<div class="toolbar">${b('unban', x.user_id, 'Lift the ban')}</div></div>`).join('') || '<div class="card panel small muted">Nobody is banned.</div>';
  else {
    const what = l => {
      const c = M.cs.get(l.target_id), on = c && !c.deleted_at ? ` by ${who(c)}` : '', txt = c && !c.deleted_at ? c.body : l.note, name = esc(M.names.get(l.target_id) || 'an account');
      const q = txt && l.action !== 'ban' ? ` <span class="muted">“${esc(txt.length > 120 ? txt.slice(0, 119) + '…' : txt)}”</span>` : '';
      return { hide: `Hid a comment${on}${q}${l.note ? ` <span class="pill m">${esc(l.note)}</span>` : ''}`, restore: `Restored a comment${on}${q}`, delete: `Deleted a comment${q}`,
        dismiss: `Dismissed the reports on a comment${on}${q}`, ban: `Banned ${name}${l.note ? `: ${esc(l.note)}` : ''}`, unban: `Lifted the ban on ${name}` }[l.action] || esc(l.action);
    };
    list = M.log.length ? `<div class="card panel"><ul class="modlog">${M.log.map(l => `<li><time class="small muted" datetime="${esc(l.at)}">${esc(new Date(l.at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}</time> ${what(l)}</li>`).join('')}</ul></div>` : '<div class="card panel small muted">Nothing yet.</div>';
  }
  const n = { reports: groups.size, hidden: M.hid.length, bans: M.bans.length };
  return `<div class="section"><div class="row-head"><h2>Moderation</h2><button type="button" class="btn sm" data-modact="reload|">Refresh</button></div>
    <div class="seg" role="group" aria-label="Moderation">${MOD_TABS.map(([k, l]) => `<button type="button" data-modtab="${k}" aria-pressed="${tab === k}">${l}${k in n ? ` (${n[k]})` : ''}</button>`).join('')}</div>
    ${list}<p class="small muted">Hiding a thread’s first comment hides its replies too, and restoring it brings them back. Deleting a comment others replied to leaves “[deleted]” above the replies; delete that too to remove the whole thread. A banned account can still read, and delete its own comments, but can’t post, react or report.</p></div>`;
}
async function modAct(act, cid) {
  if (act === 'banask') { D.modBan = cid || null; return; }
  // read what was typed now: the page redraws as soon as the button is pressed
  const uid = acct.user?.id, now = new Date().toISOString(), M = D.mod || {}, c = M.cs?.get(cid) || M.hid?.find(x => x.id === cid);
  const why = document.querySelector(`[data-modwhy="${qv(cid)}"]`)?.value || '', banWhy = $('#modBanWhy')?.value.trim() || null, banHide = !!$('#modBanHide')?.checked;
  const dismiss = () => sbRest(`reports?target_id=eq.${cid}&resolved_at=is.null`, { method: 'PATCH', body: { resolved_at: now, resolved_by: uid }, prefer: 'return=minimal' });
  try {
    if (act === 'hide') { const pid = await talkHide(cid, true, why); await dismiss(); D.talk.delete(pid); toast('Hidden.'); }
    else if (act === 'restore') { const pid = await talkHide(cid, false); D.talk.delete(pid); toast('Restored.'); }
    else if (act === 'dismiss') { await dismiss(); toast('Reports dismissed.'); }
    // delete first: if the database refuses, the reports stay open
    else if (act === 'del') { const r = await delComment(cid); await dismiss(); if (c) D.talk.delete(c.player_id); toast(r === 'kept' ? 'Deleted. Its replies stay, under “[deleted]”.' : 'Deleted.'); }
    else if (act === 'ban') { await sbRest('rpc/ban_user', { method: 'POST', body: { uid: cid, reason: banWhy, hide_all: banHide } }); D.modBan = null; D.talk.clear(); toast(banHide ? 'Banned, and everything they posted is hidden.' : 'Banned.'); }
    else if (act === 'unban') { await sbRest('rpc/unban_user', { method: 'POST', body: { uid: cid } }); toast('Ban lifted.'); }
    else return;
    track('mod_action', { act });
  } catch (e) { toast(talkErr(e)); }
  modLoad();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-react],[data-rxpick],[data-talkreply],[data-talkmore],[data-talkdel],[data-talkrep],[data-talkwhy],[data-talkhide],[data-talkretry],[data-talksignin],[data-talksort],[data-watch],[data-bell],[data-modact],[data-modtab]'); if (!t) return;
  const d = t.dataset, pid = () => t.closest('[data-talk-thread]')?.dataset.talkThread || D.pp?.id;
  if (d.react) { const [k, em] = d.react.split('|'); react(k, em); return; }
  if (d.rxpick) { const was = D.rxPick; D.rxPick = was === d.rxpick ? null : d.rxpick; if (was && was !== d.rxpick) rxPaint(was); rxPaint(d.rxpick); return; }
  if (d.talksignin !== undefined) { talkSignIn(); return; }
  if (d.talkreply) { if (!acct.user) return talkSignIn(); const id = pid(); D.replyTo = D.replyTo === d.talkreply ? null : d.talkreply; D.talkFocus = D.replyTo ? { k: 'r:' + D.replyTo, s: 0, e: 0 } : null; talkPaint(id); return; }
  if (d.talkmore) { D.talkMore.add(d.talkmore); talkPaint(pid()); return; }
  if (d.talkdel) { const id = pid(); if (D.talkDel === d.talkdel) talkDelete(id, d.talkdel); else { D.talkDel = d.talkdel; talkPaint(id); } return; }
  if (d.talkrep) { D.talkRep = D.talkRep === d.talkrep ? null : d.talkrep; D.talkRepWhy = null; talkPaint(pid()); return; }
  // a reason picked: then an optional note, sent with "Send report"
  if (d.talkwhy) { const [cid, why] = d.talkwhy.split('|'); D.talkRepWhy = { cid, why }; D.talkFocus = { k: 'rep:' + cid, s: 0, e: 0 }; talkPaint(pid()); return; }
  if (d.talksort) { D.talkSort = d.talksort; document.querySelectorAll('[data-talksort]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.talksort === d.talksort))); talkPaint(pid()); return; }
  if (d.talkhide) { const [cid, h] = d.talkhide.split('|'); talkHide(cid, h === '1').then(id => { toast(h === '1' ? 'Hidden.' : 'Restored.'); talkLoad(id, true); }).catch(er => toast(talkErr(er))); return; }
  if (d.talkretry) { talkLoad(d.talkretry, true); talkPaint(d.talkretry); return; }
  if (d.watch) { toggleWatch(d.watch); return; }
  if (d.bell !== undefined) { toggleAlerts(); return; }
  if (d.modtab) { D.modTab = d.modtab; render(); return; }
  if (d.modact) { const [act, cid] = d.modact.split('|'); if (act === 'reload') modLoad(); else modAct(act, cid); render(); }
});

  const series = (T, k) => [...seasons.map(s => P[s]?.[T]?.[k]), D.cur[T]?.[k]];
  const nb = (on) => on ? ' <span class="pill n">New</span>' : '';
  const rows = ABBR.map(T => {
    const s = staffOf(T), pr = series(T, 'passRate'), pl = series(T, 'plays'), fw = series(T, 'fpaWR'), c = C?.[T];
    const d = ok(D.B[T].passRate) && ok(pr[2]) ? (D.B[T].passRate - pr[2]) * 100 : null;
    const hcNote = c?.name && norm(c.name) !== norm(s.hc) ? ` <span class="pill q" title="ESPN lists ${esc(c.name)}">ESPN: ${esc(c.name)}</span>` : '';
    const open = D.teamOpen === T;
    return `<tr class="click${open ? ' sel' : ''}" data-team="${T}" aria-expanded="${open}"><td>${teamLogo(T)}<strong>${T}</strong> <span class="small muted">${esc(D.rec[T] || '')}</span></td><td class="l">${esc(s.hc)}${nb(s.hcNew || c?.isNew)}${hcNote}</td><td class="l">${esc(s.offCaller || s.oc)}${nb(s.offNew)}</td><td class="l">${esc(s.defCaller || s.dc)}${nb(s.defNew)}</td>
      <td>${spark(pr, v => pct(v))} ${pct(D.B[T].passRate)}${ok(d) && Math.abs(d) >= 3 ? ` <span class="${d > 0 ? 'trend-up' : 'trend-down'}">${d > 0 ? '↑' : '↓'}${Math.abs(d).toFixed(0)}</span>` : ''}</td><td>${spark(pl, f1)} ${f1(D.B[T].plays)}</td><td>${spark(fw, f1)} ${f1(D.B[T].fpaWR)}</td></tr>
      ${open ? `<tr class="seldet"><td colspan="7" style="text-align:left;white-space:normal">${teamDetail(T, seasons)}</td></tr>` : ''}`;
  }).join('');
  return `<div class="section"><div class="row-head"><h2>Teams &amp; schemes</h2><span class="small muted">Sparklines run ${seasons[0]}–${D.season}. Tap a team for the season-by-season table.</span></div>
  <div class="banner info small">Coordinators and play-callers come from offseason hiring reports as of ${STAFF_AS_OF}. ${C ? 'Head coaches are checked against ESPN; a yellow tag means ESPN lists someone else.' : 'Checking head coaches against ESPN…'} Fix anything out of date in Settings.</div>
  <div class="tscroll"><table class="teams${D.teamOpen ? ' has-sel' : ''}"><thead><tr><th class="l">Team</th><th class="l">Head coach</th><th class="l">Offense calls</th><th class="l">Defense calls</th><th>Pass rate</th><th>Plays/g</th><th>WR pts allowed</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function teamDetail(T, seasons) {
  const s = staffOf(T), all = [...seasons.map(y => [y, D.prior[y]?.[T]]), [D.season + ' so far', D.cur[T]], [D.season + ' model', D.B[T]]];
  const ks = [['passRate', 'Pass rate', pct], ['plays', 'Plays/g', f1], ['ypc', 'Rush YPC', f1], ['sacksTaken', 'Sacks taken/g', f1], ['tsTE', 'TE target share', pct], ['tsRB', 'RB target share', pct], ['fpaQB', 'QB pts allowed', f1], ['fpaRB', 'RB pts allowed', f1], ['fpaWR', 'WR pts allowed', f1], ['fpaTE', 'TE pts allowed', f1], ['sacks', 'Sacks/g', f1], ['ptsA', 'Pts allowed/g', f1]];
  return `<div class="section" style="padding:6px 0"><div class="small"><strong>${TEAMS[T][1]}:</strong> HC ${esc(s.hc)} · OC ${esc(s.oc)} · DC ${esc(s.dc)}${s.note ? ' · ' + esc(s.note) : ''}. ${s.offNew ? `New offensive play-caller, so ${D.season - 1} offense counts as ${D.B[T].kO.toFixed(1)} games` : `Offense continuity: ${D.season - 1} counts as ${D.B[T].kO.toFixed(1)} games`}; ${s.defNew ? `new defensive play-caller (${D.B[T].kD.toFixed(1)} games)` : `defense continuity (${D.B[T].kD.toFixed(1)} games)`}.</div>
  <div class="tscroll"><table class="tdet"><thead><tr><th class="l">Metric</th>${all.map(([y]) => `<th>${y}</th>`).join('')}</tr></thead><tbody>${ks.map(([k, l, f]) => `<tr><td>${l}</td>${trendCells(all.slice(0, -1).map(([, p]) => p?.[k]), f).join('')}${all.slice(-1).map(([, p]) => `<td>${p ? f(p[k]) : '—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}
function viewSettings() {
  const S = state.settings, sl = (id, label, val, min, max, step, fmt) => `<div class="slider"><label for="${id}">${label}</label><input type="range" id="${id}" data-set="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><span class="num" id="${id}-v">${fmt(val)}</span></div>`;
  return `<div class="section">${acct.admin ? '<div class="banner info"><span>You’re a moderator.</span><a class="btn sm" href="#mod">Open moderation</a></div>' : ''}<div class="row-head"><h2>Settings</h2><span class="small muted">These apply to every team. Scoring, lineup slots and league size are per team, in <button type="button" class="linkbtn" data-act="teamsettings">Team settings</button>.</span></div>
  <div class="card panel"><h3>Season</h3>
    <div class="field inline"><label for="season">Season</label><input class="inp" id="season" type="number" data-season value="${D.season}" style="width:96px"></div>
  </div>
  <div class="card panel"><h3>Projections</h3>
    <div class="seg" role="group" aria-label="Projection model">${[['trained', 'Trained'], ['classic', 'Classic']].map(([k, l]) => `<button type="button" data-model="${k}" aria-pressed="${(S.model === 'classic' ? 'classic' : 'trained') === k}">${l}</button>`).join('')}</div>
    <p class="small muted" style="margin:6px 0 0">${S.model === 'classic' ? 'Classic: Sleeper’s projection blended with each player’s form, moved by the matchup factors and weights below.' : `Trained: models learned from every NFL game since 2013 set each QB, RB, WR and TE’s weekly number and range. Waivers, kickers and D/STs use the classic model and the weights below. Expanded players, Start/Sit and Waivers’ best move also show the trained number beside the classic one and Sleeper’s own. ${D.ml ? (useTrained() ? `Updated ${new Date(D.ml.made).toLocaleString()}.` : `Not available for this week yet, so the classic model is in use.`) : 'Loading…'}`}</p></div>
  <div class="card panel"><h3>Model weights</h3>
    ${sl('blend', 'Weekly projection vs. season average', S.blend, 0, 1, 0.05, v => Math.round(v * 100) + '%')}
    ${sl('intensity', 'Matchup strength', S.intensity, 0, 1.5, 0.05, v => Math.round(v * 100) + '%')}
    ${sl('priorWeeks', `${D.season - 1} season counts as (games)`, S.priorWeeks, 0, 8, 0.5, v => (+v).toFixed(1))}
    ${FACTOR_KEYS.map(([k, l]) => sl('w.' + k, l, S.w[k], 0, 2, 0.1, v => '×' + (+v).toFixed(1))).join('')}
    <div class="small muted">Sleeper’s projection already accounts for the matchup, so matchup factors move only the season-average part of the base, and matchup strength starts at 60%.</div></div>
  <div class="card panel"><h3>Coaching staffs</h3><p class="small muted" style="margin:0">From offseason hiring reports as of ${STAFF_AS_OF}. Check "new" when a team changes its offensive or defensive play-caller; add the coach’s previous team so the model borrows that team’s tendencies.</p>
    <div class="tscroll staff"><table><thead><tr><th class="l">Team</th><th class="l">Head coach</th><th class="l">Offense play-caller</th><th class="l">New</th><th class="l">From</th><th class="l">Defense play-caller</th><th class="l">New</th><th class="l">From</th></tr></thead><tbody>
    ${ABBR.map(T => { const s = staffOf(T); const ti = (f, cls = '') => `<input class="inp ${cls}" type="text" id="st-${T}-${f}" data-staff="${T}.${f}" value="${esc(s[f])}" aria-label="${T} ${f}">`; const cb = f => `<input type="checkbox" id="st-${T}-${f}" data-staff="${T}.${f}" ${s[f] ? 'checked' : ''} aria-label="${T} ${f}">`; return `<tr><td><strong>${T}</strong></td><td class="l">${ti('hc')}</td><td class="l">${ti('offCaller')}</td><td class="l">${cb('offNew')}</td><td class="l">${ti('offPrev', 'ab')}</td><td class="l">${ti('defCaller')}</td><td class="l">${cb('defNew')}</td><td class="l">${ti('defPrev', 'ab')}</td></tr>`; }).join('')}
    </tbody></table></div><div class="toolbar"><button type="button" class="btn" data-act="resetstaff">Restore researched staffs</button></div></div>
  <div class="card panel"><details class="how"><summary>How the projection works</summary>
    <ol><li><strong>Trained model</strong> (the default): for quarterbacks, running backs, receivers and tight ends, models trained on every NFL game since 2013 start from Sleeper’s projection, take out how far Sleeper has run high or low at the position lately, and correct it from usage (targets, carries, snaps), role and depth chart, the betting line, the opponent, the weather and injuries. They’re retrained during the season, and their ranges come from how far scores landed from their projections in past seasons. The steps below are the classic model, which Waivers, kickers and D/STs always use, and everyone when Classic is chosen above. Expanded players, Start/Sit and Waivers’ best move show the trained number beside the classic one and Sleeper’s own projection, so you can see where they differ (Sleeper’s comes with no range).</li>
    <li><strong>Base:</strong> Sleeper’s weekly projection, converted to each team’s scoring (PPR, half-PPR or standard), blended with the player’s season average (slider above). A healthy player Sleeper doesn’t project while it projects a teammate at his position is a backup, with a base of 0 however he scored filling in. When the projection is under half or over 1.6× his average, his role changed and the projection leads (90%).</li>
    <li><strong>Matchup factors</strong>, each capped at ±25%: fantasy points the opponent allows to the position; secondary (pass yards allowed) or run defense (yards per carry allowed, plus the player’s own line); sacks allowed by the offense vs. sacks by the opposing defense; the team’s Vegas implied total and spread, with the opponent’s record; the offense’s pass rate and pace; and the opponent’s defensive roster changes (signings, trades, injuries) that its stats don’t show yet. Together they’re capped at ±20%, and they move only the season-average part of the base, since Sleeper’s projection already counts the matchup.</li>
    <li><strong>Weather &amp; stadium:</strong> domes and closed retractable roofs give passers and kickers a small lift. Outdoors, the forecast for the three hours from kickoff (Open-Meteo) moves points between passing, running and kicking: wind over 10 mph hurts deep passing and kickers most, rain and snow add carries, and freezing cold costs kickers and passers a little. The betting total already lowers everyone in bad weather, so this factor doesn’t cut them all again. Each player’s role sets how much he feels it (a deep threat more than a slot receiver, a running quarterback less than a pocket passer), and his own scores indoors vs. outdoors are shown for context but don’t move the projection. Like every matchup factor, it moves only the part of the projection that comes from his scoring average, since Sleeper’s projection already counts the weather.</li>
    <li><strong>Scheme history:</strong> each team’s numbers blend ${D.season} games with last season. When the play-caller is unchanged, last season counts as ${S.priorWeeks} games. When the play-caller is new, it counts as at most 1.5 games, mixed with the new coach’s old team, and the player’s range widens by 10%.</li>
    <li><strong>Probabilities:</strong> scores are treated as a bell curve around the projection, with spread from the player’s weekly scores (shrunk toward a typical spread for the position). A lineup’s range allows for teammates and opponents scoring together (a QB and his receivers most). Every week’s forecasts are frozen before kickoff and later checked against what players scored.</li>
    <li><strong>Lineup:</strong> an exact assignment fills every slot to maximize the chosen strategy. Bye weeks and players ruled Out or on IR sit automatically. A questionable or doubtful player counts at his chance to play. Win chance (Pro, Sleeper leagues) compares your lineup’s total with your opponent’s, both spreads and how teammates and opponents in the same game score together, and picks the lineup most likely to win.</li></ol></details>
    <div class="toolbar"><button type="button" class="btn danger" data-act="reset">${D.resetArm ? 'Press again to erase everything' : 'Reset all saved data'}</button><span class="small muted">Removes your roster, overrides, settings, saved lineups and cached stats from this browser${acct.user ? ', and signs you out (your account keeps its copy)' : ''}.</span></div></div>
  </div>`;
}

/* Yahoo's roster and player tables tag each player "Team - Pos" ("Josh Allen Buf - QB", "Pittsburgh Pit - DEF"), maybe
   with an injury status after it, and sometimes on a line of its own under the name. */
const YAHOO_TAG = /\b([A-Za-z]{2,3})\s+-\s+((?:QB|RB|WR|TE|K|DEF)(?:\s*,\s*(?:QB|RB|WR|TE|K|DEF))*)\b.*$/;
// lines in a pasted table that aren't players (kickoff times, scores, the header row, section headers, notes): never "not found"
const PASTE_NOISE = /\d{1,2}:\d{2}\s*[ap]\.?m|\b[WLT]\s*\d+\s*-\s*\d+\b|^(pos|slot)\b.*\bplayers?\b|^(injured reserve|bench|starters?|reserves?|empty|bye( week)?|(no )?(new )?player notes?)$/i;
/* Matches pasted text (ESPN's or Yahoo's roster table, or one name per line) against every player with a projection or a
   game played. Longest names are tried first so "Kenneth Walker" wins over "Ken Walker"-style partials. A Yahoo tag picks
   between players with the same name, and names a D/ST by its team. Used for rosters and free-agent lists. */
function matchPasted(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const live = [...D.U.values()].filter(u => (D.proj[u.id]?.pts || 0) > 0 || D.H[u.id] || D.prevPPG?.[u.id]);
  const names = live.map(u => [norm(u.name), u]).filter(([n]) => n.includes(' ') && n.length >= 6).sort((a, b) => b[0].length - a[0].length || (D.M[b[1].id]?.mean || 0) - (D.M[a[1].id]?.mean || 0));
  const ids = [], miss = [];
  for (const raw of lines) {
    let l = raw, u = null;
    const y = YAHOO_TAG.exec(l), yT = y ? fixAbbr(y[1].toUpperCase()) : null, yP = y ? y[2].split(',')[0].trim() : null;
    if (y) { l = l.slice(0, y.index).trim(); if (yP === 'DEF' && TEAMS[yT]) u = D.U.get(yT); else if (!l) continue; }   // a tag on its own line goes with the name above it
    const k = norm(l);
    if (!u && (k.length < 4 || /^\d/.test(k))) continue;
    if (!u) u = (D.nameIdx.get(k) || []).map(id => D.U.get(id)).sort((a, b) => (y ? (b.pos === yP) - (a.pos === yP) || (b.team === yT) - (a.team === yT) : 0) || (D.M[b.id]?.mean || 0) - (D.M[a.id]?.mean || 0))[0];
    if (!u) { const T = teamOf(k); if (T) u = D.U.get(T); }   // a line naming a team ("Pittsburgh Steelers", "PIT D/ST") is its D/ST
    if (!u) u = names.find(([n]) => k.includes(n))?.[1];
    if (!u && /d\/?st|defense|\bdef\b/.test(k)) { const T = ABBR.find(a => k.includes(TEAMS[a][1].toLowerCase())); if (T) u = D.U.get(T); }

}
