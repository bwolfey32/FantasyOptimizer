<style>
/* Layout: a coach's call sheet. One column of lineup rows on chalk-green paper, numbers set in a condensed jersey face, turf green as the only accent. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --surface-2: #e3e9e4;
  --ink: #13201a;
  --muted: #4a5850;
  --line: #cfd8d1;
  --accent: #075b37;
  --gold: #8a6510;
  --accent-ink: #ffffff;
  --good: #1b7a4b;
  --bad: #b23a30;
  --warn: #a8670f;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1512; --surface: #151e1a; --surface-2: #1c2722; --ink: #e4ebe6; --muted: #a9b7af;
    --line: #29352f; --accent: #4fc38e; --accent-ink: #07130d; --good: #4fc38e; --bad: #f07a6e; --warn: #e3b052; --gold: #e2bb52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1512; --surface: #151e1a; --surface-2: #1c2722; --ink: #e4ebe6; --muted: #a9b7af;
  --line: #29352f; --accent: #4fc38e; --accent-ink: #07130d; --good: #4fc38e; --bad: #f07a6e; --warn: #e3b052; --gold: #e2bb52;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 56px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 30px; text-transform: uppercase; }
h2 { font-size: 22px; text-transform: uppercase; }
h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .03em; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .mark { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; }
.brand .logo { flex: 0 0 auto; width: 56px; height: 56px; object-fit: contain; }
.wordmark { display: flex; flex-direction: column; min-width: 0; }
.wordmark h1 { font-size: 32px; }
.tagline { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13.5px; color: var(--muted); margin-right: 4px; background: none; border: 1px solid transparent; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.status:hover { border-color: var(--line); color: var(--ink); }
.freshp { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.freshp table { font-size: 14px; }
.freshp td { white-space: normal; vertical-align: top; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.live i { background: var(--good); }
.status.busy i { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.status.old i { background: var(--warn); }
@keyframes pulse { 50% { opacity: .3; } }

/* This week at a glance */
.brief { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); padding: 12px 16px; font-size: 16px; line-height: 1.6; }
.brief:empty { display: none; }
.brief .bteam { font-weight: 600; }
.brief .sep { color: var(--muted); margin: 0 6px; }
.blink { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; border-bottom: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.blink:hover { border-bottom-color: var(--accent); }
.blink .n { font-family: var(--font-display); font-weight: 700; font-size: 21px; font-variant-numeric: tabular-nums; }
.blink .n.up { color: var(--good); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sel, .inp { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.inp:focus, .sel:focus { border-color: var(--accent); outline: none; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.danger { color: var(--bad); }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs .navlink { flex: 0 0 auto; text-decoration: none; border-bottom: 3px solid transparent; padding: 8px 14px; font-family: var(--font-display); font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); white-space: nowrap; text-align: center; }
.tabs .navlink:hover { color: var(--ink); }
.tabs .navlink[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
#settingsBtn[aria-pressed="true"], #acctBtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
#acctBtn { display: inline-flex; align-items: center; gap: 7px; }
#acctBtn i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
#acctBtn i.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
#acctBtn i.err, #acctBtn i.wait { background: var(--warn); }
.acct-form { display: flex; flex-wrap: wrap; gap: 8px; }
.acct-form .inp { flex: 1 1 220px; max-width: 360px; }
.acct-or { display: flex; align-items: center; gap: 10px; max-width: 520px; color: var(--muted); font-size: 13px; }
.acct-or::before, .acct-or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.acct-choice { display: flex; flex-wrap: wrap; gap: 8px; }
.gbtn { display: inline-flex; align-items: center; gap: 10px; }
.gbtn svg { flex: none; }
.hist .hdet > td { padding: 4px 10px 12px; background: var(--surface-2); }
.hist .hdet table { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
.hist .hbench td { color: var(--muted); }
.wxt td { white-space: normal; vertical-align: top; }
.wxt td:first-child, .wxt td:nth-child(2) { white-space: nowrap; }
.wxt .wxc { min-width: 230px; }
.wxt .chip { margin: 0 2px 2px 0; }
@media (max-width: 600px) {
  .wxt, .wxt tbody, .wxt tr, .wxt td { display: block; }
  .wxt thead { display: none; }
  .wxt tr { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .wxt tr:last-child { border-bottom: 0; }
  .wxt td { border: 0; padding: 1px 0; min-width: 0 !important; white-space: normal !important; }
  .wxt td:first-child { font-size: 12.5px; color: var(--muted); }
  .wxt td:empty { display: none; }
}
@media (max-width: 600px) { .hist th, .hist td { padding: 6px 6px; } .hist .hdet > td { padding: 4px 4px 10px; } }
@media (max-width: 600px) { .tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; } .tabs .navlink { padding: 8px 2px; font-size: 14.5px; letter-spacing: .01em; white-space: normal; line-height: 1.1; } }

/* Team context bar (every page) */
.teamctx { display: flex; flex-direction: column; gap: 8px; }
.teamctx:empty { display: none; }
.tb-teams { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tchip { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; max-width: 220px; padding: 5px 12px 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; text-align: left; }
.tchip:hover { border-color: var(--accent); }
.tchip .tn { font-family: var(--font-display); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tchip .tm { font-size: 12.5px; color: var(--muted); }
.tchip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); box-shadow: inset 0 -3px 0 var(--accent); }
.tchip.add { justify-content: center; align-items: center; border-style: dashed; color: var(--accent); font-weight: 600; }
.tb-ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 14px; }
.tb-item { display: inline-flex; align-items: center; gap: 6px; }
.tb-item + .tb-item::before { content: "·"; color: var(--muted); margin-right: 8px; }
.tb-actions { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.sel.sm { padding: 3px 6px; }
.src { display: inline-flex; align-items: center; gap: 6px; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.hsub { font-family: var(--font-body); font-size: 14px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); }
@media (max-width: 600px) { .tb-actions { margin-left: 0; width: 100%; } }

/* Panels: setup flow, team settings, share */
#panels:empty { display: none; }
.flow, .tsp, .io, .acct, .hist { scroll-margin-top: 12px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); }
.seg.methods { display: grid; grid-template-columns: repeat(4, auto); max-width: 100%; }
@media (max-width: 600px) { .seg.methods { grid-template-columns: repeat(2, minmax(0, 1fr)); align-self: stretch; } }
.flow .seg, .tsp .seg { align-self: flex-start; }
.seg a { padding: 6px 14px; font-weight: 500; font-size: 14px; text-decoration: none; color: var(--ink); }
.seg a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.seg.sub { align-self: flex-start; }
.flow-body { display: flex; flex-direction: column; gap: 10px; }
.flow-body p { margin: 0; }
.ts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 18px; }
.rv-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px 24px; }
.rv-players, .rv-teams { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.rv-pos { display: inline-block; min-width: 40px; font-family: var(--font-display); font-weight: 700; color: var(--accent); }
.rv-dest { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.rv-dest input, .io input[type=checkbox] { accent-color: var(--accent); }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchips .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 4px 2px 10px; }
.chip-x { background: none; border: 0; font-size: 16px; line-height: 1; padding: 0 4px; color: var(--muted); cursor: pointer; }
.chip-x:hover { color: var(--bad); }
@media (max-width: 780px) { .rv-grid { grid-template-columns: minmax(0, 1fr); } }

/* Player search with suggestions */
.ac { position: relative; }
.ac .inp { width: 100%; }
.ac-list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(0, 0, 0, .18); max-height: 340px; overflow-y: auto; }
.ac-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 8px 12px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; }
.ac-item:last-child { border-bottom: 0; }
.ac-item[aria-selected="true"], .ac-item:hover { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.ac-main { display: flex; flex-direction: column; min-width: 0; }
.ac-tag { flex: 0 0 auto; font-size: 12.5px; font-weight: 600; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; }
.ac-tag.on { color: var(--muted); }
.ac-empty { padding: 10px 12px; }
.addbox { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) 56px 34px auto auto; gap: 10px; align-items: center; padding: 8px 14px; }
.rrow .rr-proj { font-size: 20px; text-align: right; }
.rrow .rr-ovr { width: 92px; }
.rrow [aria-disabled="true"] { opacity: .55; }
.empty-row { padding: 14px; }
.rlinks { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 6px; }
.empty { gap: 10px; }
.flash { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }

/* Toast (Undo and quick confirmations) */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; align-items: center; gap: 12px; max-width: min(560px, calc(100vw - 32px)); padding: 10px 12px 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); box-shadow: 0 10px 28px rgba(0, 0, 0, .25); font-size: 14.5px; }
.toast .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 45%, transparent); }

.banner { border: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.banner.info { border-left-color: var(--accent); }
.banner.err { border-left-color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.wrap > *, .section > *, #main { min-width: 0; max-width: 100%; }
.banner { overflow-wrap: anywhere; }
.section { display: flex; flex-direction: column; gap: 10px; }
.row-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.summary > div { background: var(--surface); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.summary .big { font-size: 34px; line-height: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Fantasy team headers */
.teambar { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tteams { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tteam { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 128px; max-width: 260px; padding: 8px 14px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; text-align: left; }
.tteam:hover { border-color: var(--accent); }
.tteam .tn { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.15; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tteam .tm { font-size: 13px; color: var(--muted); white-space: normal; line-height: 1.4; }
.tteam .tb { white-space: nowrap; }
.tteam .tm .num { color: var(--ink); }
.tteam[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); box-shadow: inset 0 -3px 0 var(--accent); }
.tteam.add { min-width: 0; justify-content: center; align-items: center; border-style: dashed; color: var(--accent); font-weight: 600; }
.tmanage { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tmanage .inp { flex: 0 1 220px; }
.io .iochecks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
.io .iochecks label { display: inline-flex; align-items: center; gap: 6px; }
.io .iocode { min-height: 70px; font-size: 12px; word-break: break-all; }
.io input[type=checkbox] { accent-color: var(--accent); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.btn:disabled { opacity: .5; cursor: default; }

/* Lineup rows */
.list { display: flex; flex-direction: column; }
.list .item + .item { border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 54px minmax(0, 1.5fr) minmax(0, 1.25fr) 62px 64px 92px 64px; align-items: center; gap: 12px; padding: 10px 14px; width: 100%; background: none; border: 0; text-align: left; }
.prow:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.lhead { padding-block: 8px; }
.lhead:hover { background: none; }
.slot { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .04em; color: var(--accent); }
.slot.bench { color: var(--muted); }
.pname { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.psub { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.match { font-size: 13px; min-width: 0; }
.match .opp { font-weight: 600; }
.proj { font-size: 24px; text-align: right; line-height: 1; }
.range { font-size: 13px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.pav { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
.prow > .grade { justify-self: center; }
.grade { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; border: 1px solid var(--line); }
.g-A { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.g-B { background: color-mix(in srgb, var(--good) 10%, transparent); color: var(--good); }
.g-C { color: var(--muted); }
.g-D { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
.g-F { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; line-height: 1.4; white-space: nowrap; }
.pill.q { color: var(--warn); }
.pill.o { color: var(--bad); }
.pill.n { color: var(--accent); }
.pill.m { color: var(--muted); }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.up { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.chip.down { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }

/* Detail */
.detail { padding: 4px 14px 16px 80px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
.factors { display: flex; flex-direction: column; gap: 9px; }
.factor { display: grid; grid-template-columns: minmax(0, 1fr) 120px 48px; gap: 10px; align-items: center; }
.factor .fl { font-weight: 600; font-size: 13.5px; }
.factor .fn { font-size: 13px; color: var(--muted); }
.fbar { position: relative; height: 10px; background: var(--surface-2); border-radius: 3px; }

/* ---------- Sleeper league sync ----------

/* Re-sync every linked team (rosters, slots, scoring, league-wide rostered players). Quiet on failure: the last sync stays. */
async function slAutoSync(force) {
  stashTeam();
  const linked = state.teams.filter(t => t.sleeper?.leagueId); if (!linked.length) return;
  const byLeague = {}; for (const t of linked) (byLeague[t.sleeper.leagueId] = byLeague[t.sleeper.leagueId] || []).push(t);
  D.slSyncing = true; renderSyncLine();
  for (const [lid, teams] of Object.entries(byLeague)) {
    if (!force && teams.every(t => Date.now() - (t.sleeper.syncedAt || 0) < 5 * 60000)) continue;
    try {
      const [lg, ros] = await Promise.all([fetchJSON(`${SL}/league/${lid}`), fetchJSON(`${SL}/league/${lid}/rosters`)]);
      if (!lg?.league_id || !Array.isArray(ros)) continue;
      for (const t of teams) {
        const a = slApply(lg, ros, t.sleeper.rosterId); if (!a) continue;
        Object.assign(t, { roster: a.roster, slots: a.slots, scoring: a.scoring, tePrem: a.tePrem, example: false });
        t.sleeper = Object.assign({}, t.sleeper, { rostered: a.rostered, starters: a.starters, rosterMax: a.rosterMax, reserve: a.reserve, syncedAt: Date.now(), leagueName: lg.name, notes: slNotes(lg) });
        t.waivers = Object.assign({}, t.waivers, { teams: a.size });
      }
    } catch {}
  }
  D.slSyncing = false;
  applyTeam(curTeam()); D.wCache = null; save(); syncScoring(); render();
}

  if (!state.roster.length) return `<div class="card panel"><h2>Add your roster first</h2><p style="margin:0">Waiver suggestions compare free agents against your players. <button type="button" class="linkbtn" data-act="flow" data-method="sleeper" data-dest="replace">Import your team</button> or add players in <a href="#roster" data-tab="players">Roster</a>.</p></div>`;
  const R = computeWaivers(), { weeks, H, moves, needs } = R;
  const hLab = H === 1 ? `week ${weeks[0]}` : `weeks ${weeks[0]}–${weeks[H - 1]}`;
  const ownTxt = id => D.own.has(id) ? `${D.own.get(id) < 1 ? '<1' : Math.round(D.own.get(id))}% owned` : 'unowned';

  const warn = [];

  const posBest = POS.map(p => { const top = R.byH.filter(id => D.U.get(id).pos === p).slice(0, 4); return top.map(id => `<tr><td><strong>${esc(D.U.get(id).name)}</strong> <span class="small muted">${p} · ${D.U.get(id).team}</span></td><td>${ownTxt(id)}</td><td>${f1(rosBase(id))}</td><td>${f1(R.sumH(id))}</td><td class="l">${schedStrip(id, weeks, Math.min(H, 6))}</td><td><button type="button" class="btn sm" data-taken="${esc(id)}">Taken</button></td></tr>`).join(''); }).join('');

    const why = s.auto ? `top-${s.cut} ${u.pos} when healthy` : s.rw > 18 ? 'out for the season' : `not a top-${s.cut} ${u.pos} when healthy`;
    const status = `<span class="small muted">${mine ? `Your choice (automatic: ${s.auto ? 'keep' : 'can drop'})` : `Automatic: ${why}`}</span>`;
    const btn = `<div class="seg" role="group" aria-label="Drop suggestions for ${esc(u.name)}">
      <button type="button" data-keepmode="${esc(s.id)}" data-mode="${s.auto ? 'auto' : 'keep'}" aria-pressed="${s.keep}">Keep</button>
      <button type="button" data-keepmode="${esc(s.id)}" data-mode="${s.auto ? 'drop' : 'auto'}" aria-pressed="${!s.keep}">Can drop</button></div>`;
    return `<div class="item stash"><div class="sinfo"><span class="pname">${esc(u.name)}</span><span class="psub">${u.pos} · ${u.team || 'FA'} ${injPill(D.M[s.id])}</span><span class="small muted">${s.prev ? `${f1(s.prev[0])} pts/g over ${s.prev[1]} games in ${D.season - 1}` : `No ${D.season - 1} stats`} · ${u.pos}${s.rank} when healthy (ranked on ${f1(s.rv)} pts/g)</span></div>
      <div class="sctl"><label class="small muted" for="rw-${esc(s.id)}">Expected back</label><select class="sel" id="rw-${esc(s.id)}" data-rw="${esc(s.id)}">${opts}</select></div>
      <div class="sstat">${status}</div>
      ${btn}</div>`;
  }).join('')}</div>` : '';
  const nTaken = Object.keys(W.taken).length;
  const longTerm = W.rank === 'blend';
  const slFA = W.source === 'sleeper' && state.sleeper?.rostered;
  const faRow = slFA ? `<div class="card fasetup"><div class="fa-line"><span><strong>Free agents:</strong> exact, from your Sleeper league (${esc(state.sleeper.leagueName || 'league')}, synced ${ago(state.sleeper.syncedAt)}).</span>
      <button type="button" class="btn sm" data-act="slsync">Sync now</button></div></div>`
    : `<div class="card fasetup"><div class="fa-line"><span><strong>Free agents:</strong> ${W.source === 'list' && W.faList.length ? `your league’s list (${W.faList.length} players)` : `estimated: players under ${W.ownMax}% owned across ESPN leagues`}.${state.sleeper ? '' : ' On Sleeper? Sync your league for exact free agents.'}</span>
      <button type="button" class="btn sm ${W.source === 'list' && W.faList.length ? '' : 'primary'}" data-act="toggleFa" aria-expanded="${!!D.faOpen}">${W.source === 'list' && W.faList.length ? 'Update my league’s free agents' : 'Use my league’s free agents'}</button></div>
    ${D.faOpen ? `<p class="small muted" style="margin:0">On ESPN, open Players → Add Players in your league, copy the free-agent table (a few positions or pages is fine), and paste it here.</p>
    <textarea class="inp" id="faPaste" placeholder="Paste ESPN's free-agent list"></textarea>
    <div class="toolbar"><button type="button" class="btn primary" data-act="pastefa">Use these free agents</button>${W.faList.length ? `<button type="button" class="btn" data-act="clearfa">Go back to estimates</button>` : ''}<span class="small muted">${esc(D.faMsg || '')}</span></div>` : (D.faMsg ? `<span class="small muted">${esc(D.faMsg)}</span>` : '')}</div>`;
  return `<div class="section">
  <div class="row-head"><h2>Waiver Optimizer</h2><span class="small muted">Add/drop moves ranked by expected lineup points gained</span></div>

  ${warn.map(w => `<div class="banner small">${esc(w)}</div>`).join('')}

  <div class="card list">${moveRows}</div>
  ${persSection(weeks, H)}
  <div class="row-head"><h2>Top free agents by position</h2><span class="small muted">Projected points over ${hLab}</span></div>
  <div class="tscroll"><table><thead><tr><th class="l">Player</th><th>Owned</th><th>Pts/g</th><th>Next ${H}</th><th class="l">Schedule</th><th></th></tr></thead><tbody>${posBest}</tbody></table></div>

}

/* ---------- rendering ---------- */
/* Start/sit calls worth a second look: a starter whose best eligible bench player has at least a 38% chance of
   outscoring him, or a starter tagged questionable or doubtful. Closest calls first. */
const shortName = id => { const u = D.U.get(id); return !u ? '' : u.pos === 'DEF' ? (TEAMS[u.team]?.[1] || u.team) : u.name.split(' ').slice(-1)[0]; };
const pBeats = (a, b) => (a.sd || b.sd) ? Phi((a.mean - b.mean) / Math.sqrt(a.sd ** 2 + b.sd ** 2)) : (a.mean >= b.mean ? 1 : 0);
function reviewDecisions() {
  if (!state.roster.length || !D.M) return [];
  const { starters, bench } = optimize(), out = [];
  const alts = bench.filter(r => r.status === 'ok' && !r.locked);
  for (const s of starters) {
    const st = s.r; if (!st || st.locked) continue;
    const alt = alts.filter(b => s.slot.elig.includes(b.pos)).sort((x, y) => y.mean - x.mean)[0];
    const tagged = /^(questionable|doubtful)/i.test(st.inj || '');
    if (!alt) continue;
    const p = pBeats(alt, st);
    if (p >= 0.38 || tagged) out.push({ start: st.id, alt: alt.id, slot: s.slot.label || s.slot.k, p, tagged });
  }
  const seen = new Set();
  return out.filter(d => !seen.has(d.alt) && seen.add(d.alt)).sort((a, b) => b.p - a.p);
}
/* The one-line briefing under the header: lineup total, calls to review, best waiver move. */
function renderBrief() {
  const el = $('#brief'); if (!el) return;
  if (D.loading || D.failed) { el.innerHTML = ''; return; }
  const team = esc(curTeam().name);
  if (!state.roster.length) { el.innerHTML = `<span class="bteam">${team}:</span> import your roster to get Benny’s picks. <button type="button" class="blink" data-act="flow" data-method="sleeper" data-dest="replace">Import your team</button>`; return; }
  const { starters } = optimize(), proj = starters.reduce((s, x) => s + (x.r ? x.r.mean : 0), 0);
  const dec = reviewDecisions(), W = computeWaivers(), best = W.moves[0];
  const decTxt = dec.length ? `<button type="button" class="blink" data-brief="decide"><span class="n">${dec.length}</span> decision${dec.length === 1 ? '' : 's'} to review</button>` : `<span>no close calls</span>`;
  const bestTxt = best ? `<button type="button" class="blink" data-brief="waiver">best waiver move <span class="n up">+${f1(best.hz)}</span> pts over ${W.H} week${W.H === 1 ? '' : 's'}</button>` : `<span>no waiver move worth making</span>`;
  el.innerHTML = `<span class="bteam">${state.example ? 'Demo team' : team}:</span> your optimal lineup projects for <button type="button" class="blink" data-tab="lineup"><span class="n">${f1(proj)}</span> points</button><span class="sep">·</span>${decTxt}<span class="sep">·</span>${bestTxt}`;
}
/* Freshness: "Updated 12 minutes ago", refreshed every minute. Live data is just-now; a saved copy shows its age. */
function ago(t) {
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 2) return 'just now'; if (m < 60) return `${m} minutes ago`;
  const h = Math.round(m / 60); if (h < 24) return `${h} hour${h === 1 ? '' : 's'} ago`;
  return 'on ' + new Date(t).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}
function renderStatus() {
  const el = $('#status'); if (!el) return;
  let cls = '', txt = 'Loading…';
  if (D.failed) { cls = 'old'; txt = 'Data unavailable'; }
  else if (D.loadedAt && !D.loading) {
    const age = Date.now() - D.loadedAt.getTime();
    txt = `${fmtName()} · Updated ${ago(D.loadedAt.getTime())}`;
    cls = D.refreshing ? 'busy' : age > 36e5 * 12 ? 'old' : 'live';
    if (D.refreshing) txt = `${fmtName()} · Updated ${ago(D.loadedAt.getTime())} · refreshing…`;
  } else if (D.loading) cls = 'busy';
  el.className = 'status ' + cls; el.lastElementChild.textContent = txt;
  renderFresh();
}
/* The freshness panel behind the status button: when each input last changed at its source, and when this page got it. */
function renderFresh() {
  const p = $('#fresh'), b = $('#status'); if (!p) return;
  p.hidden = !D.freshOpen; if (b) b.setAttribute('aria-expanded', String(!!D.freshOpen)); if (!D.freshOpen) return;
  const F = D.fresh || {}, at = t => t ? `${ago(t)} <span class="muted">(${new Date(t).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })})</span>` : '<span class="muted">not available</span>';
  const rows = [
    ['Projections', 'Sleeper last changed a projection', F.proj],
    ['Injury news', 'Latest player news or injury update', F.news],
    ['Vegas lines & scores', 'Checked with ESPN', F.lines],
    ['Waiver ownership', 'Checked with ESPN', F.own],
    ['Weather forecast', 'Checked with Open-Meteo', F.wx],
    ['Stats & defenses', 'Weekly stats and defensive rosters', F.stats],
  ];
  const page = D.snapshot ? `Showing the saved copy from ${ago(D.loadedAt.getTime())}${D.refreshing ? '; getting live data now' : '; live data couldn’t be reached'}.` : `Live data loaded ${ago(D.loadedAt?.getTime() || Date.now())}.`;
  // saved copies made before timestamps were recorded have none; show only the page line for those
  p.innerHTML = `<div class="row-head"><h3>Data freshness</h3><button type="button" class="btn sm" data-act="fresh">Close</button></div>
    ${D.fresh ? `<table><tbody>${rows.filter(r => r[2]).map(([k, sub, t]) => `<tr><td class="l"><strong>${k}</strong><div class="small muted">${sub}</div></td><td class="l">${at(t)}</td></tr>`).join('')}</tbody></table>` : ''}
    <div class="small">${page} The saved copy refreshes every three hours; Refresh pulls the newest data now.</div>`;
}
setInterval(renderStatus, 60000);
/* ---------- navigation ----------
   Five destinations, each with its own address (#lineup, #start-sit, #waivers, #roster, #research), so Back, refresh
   and shared links land on the same screen. Research has two subpages; Settings is a utility page off the header. */
const NAV = [['lineup', 'Lineup'], ['compare', 'Start / Sit'], ['waivers', 'Waivers'], ['players', 'Roster'], ['defenses', 'Research']];
const HASH = { lineup: 'lineup', compare: 'start-sit', waivers: 'waivers', players: 'roster', defenses: 'research', teams: 'research-teams', weather: 'research-weather', settings: 'settings' };
const TAB_OF = Object.fromEntries(Object.entries(HASH).map(([k, v]) => [v, k]));
const navOf = tab => tab === 'teams' || tab === 'weather' ? 'defenses' : tab;
function go(tab, opts = {}) {
  if (!HASH[tab]) return;
  D.flash = opts.keepFlash ? D.flash : null;
  if (location.hash.slice(1) !== HASH[tab]) { D.navScroll = opts.scroll !== false; location.hash = HASH[tab]; return; }   // hashchange renders
  state.tab = tab; save(); render(); if (opts.scroll !== false) window.scrollTo(0, 0); runAfter();
}
window.addEventListener('hashchange', () => {
  const tab = TAB_OF[location.hash.slice(1)]; if (!tab) return;
  state.tab = tab; save(); render(); if (D.navScroll !== false) window.scrollTo(0, 0); D.navScroll = true; runAfter();
});
// a one-shot step to run after the next page renders (scroll to a team, highlight the best move)
function runAfter() { const f = D.after; D.after = null; if (f) setTimeout(f, 30); }
function weekOptions() {
  return D.snapshot ? `<option selected>${D.week}</option>` : Array.from({ length: 18 }, (_, i) => `<option value="${i + 1}" ${D.week === i + 1 ? 'selected' : ''}>${i + 1}${D.detWeek === i + 1 && D.season === D.detSeason ? ' (now)' : ''}</option>`).join('');
}
function render() {
  const nav = navOf(state.tab);
  $('#tabs').innerHTML = NAV.map(([k, l]) => `<a href="#${HASH[k]}" class="navlink" data-tab="${k}" ${nav === k ? 'aria-current="page"' : ''}>${l}</a>`).join('');
  $('#settingsBtn')?.setAttribute('aria-pressed', String(state.tab === 'settings'));
  renderStatus(); renderAcct();
  $('#teamctx').innerHTML = D.loading || D.failed ? '' : teamBar();
  $('#panels').innerHTML = D.acctOpen && acct.on ? accountPanel() : D.loading || D.failed ? '' : D.flow ? flowPanel() : D.tsOpen ? teamSettingsPanel() : D.ioOpen ? sharePanel() : '';
  const msgs = [];
  if (D.flash && !D.loading) msgs.push(`<div class="banner info flash"><span>${D.flash.html}</span><button type="button" class="btn sm" data-act="flashclose" aria-label="Dismiss">Dismiss</button></div>`);
  // Only interrupt for problems that change the picks: missing projections or schedule, or data that's gone stale.
  const age = D.loadedAt ? Date.now() - D.loadedAt.getTime() : 0;
  if (!D.loading && !D.failed && D.snapshot && !D.refreshing && age > 36e5 * 36) msgs.push(`<div class="banner">These numbers are from ${esc(D.loadedAt.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' }))}, so injury news since then isn’t included. Press Refresh to try for newer data.</div>`);
  if (!D.loading && !D.snapshot && D.errors.some(e => /projections|schedule/i.test(e))) msgs.push(`<div class="banner err"><strong>Some of this week’s data didn’t load.</strong> Picks may be incomplete. Press Refresh to try again.</div>`);
  if (!D.loading && state.example && state.tab === 'lineup' && !D.flow) msgs.push(`<div class="banner info exban"><span><strong>You’re viewing the Demo team.</strong> Import or build your own team to get Benny’s picks for it.</span><button type="button" class="btn sm primary" data-act="flow" data-method="sleeper" data-dest="replace">Import your team</button></div>`);
  $('#msgs').innerHTML = msgs.join('');
  const main = $('#main');
  if (D.failed) { renderBrief(); main.innerHTML = `<div class="card panel"><h2>Couldn’t load this week’s data</h2><p style="margin:0">Sleeper and ESPN didn’t respond. Check your connection and press Refresh projections.</p></div>`; return; }

/* ---------- player search (Roster and Build manually) ----------
   Suggests as you type from every player, whatever list is showing, with position, team and roster status. */
function acMatches(q) {
  q = norm(q); if (q.length < 2) return [];
  // an exact team code ("dal") lists that team's players first; otherwise name matches rank by where they match
  const teamCode = ABBR.find(a => a.toLowerCase() === q), out = [];
  for (const u of D.U.values()) {
    if (!D.M[u.id] && !D.prevPPG?.[u.id]) continue;
    const n = norm(u.name), i = n.indexOf(q), last = n.split(' ').slice(-1)[0];
    const teamHit = (u.team || '').toLowerCase() === q || (u.pos === 'DEF' && norm(TEAMS[u.team]?.[1] || '').startsWith(q));
    if (i < 0 && !teamHit) continue;
    out.push([(teamCode && u.team === teamCode ? 400 : i === 0 ? 300 : last.startsWith(q) ? 200 : i > 0 ? 100 : 50) + (D.M[u.id]?.mean || 0), u]);
  }
  return out.sort((a, b) => b[0] - a[0]).slice(0, 8).map(x => x[1]);
}
function renderAc(inputId) {
  const inp = $('#' + inputId), list = $('#' + (inputId === 'addq' ? 'acList' : 'mqList')); if (!inp || !list) return;
  const mode = inputId === 'addq' ? 'roster' : 'manual', items = acMatches(inp.value), have = new Set(mode === 'manual' ? D.flow?.manual || [] : state.roster);
  D.ac = { input: inputId, items, idx: Math.max(0, Math.min(D.ac?.input === inputId ? D.ac.idx : 0, items.length - 1)) };
  const open = inp.value.trim().length >= 2; list.hidden = !open; inp.setAttribute('aria-expanded', String(open));
  list.innerHTML = items.length ? items.map((u, i) => { const r = D.M[u.id], on = have.has(u.id); return `<button type="button" role="option" class="ac-item" data-acadd="${esc(u.id)}" data-acmode="${mode}" aria-selected="${i === D.ac.idx}"><span class="ac-main"><span class="pname">${esc(u.name)}</span><span class="psub">${u.pos === 'DEF' ? 'D/ST' : u.pos} · ${u.team || 'FA'}${r && r.status !== 'bye' ? ` · ${f1(r.mean)} proj` : r?.status === 'bye' ? ' · bye' : ''}${u.inj ? ' · ' + esc(u.inj) : ''}</span></span><span class="ac-tag ${on ? 'on' : ''}">${on ? 'On roster' : 'Add'}</span></button>`; }).join('')
    : `<div class="ac-empty small muted">No player matches “${esc(inp.value.trim())}”.</div>`;
}
function acPick(id, mode) {
  const u = D.U.get(id); if (!u) return;
  if (mode === 'manual') {
    const set = D.flow.manual; if (!set.includes(id)) set.push(id);
    const ml = $('#manualList'); if (ml) ml.innerHTML = manualListHTML();
    const rb = $('[data-act=flowmanual]'); if (rb) { rb.disabled = false; rb.textContent = `Review ${set.length} player${set.length === 1 ? '' : 's'}`; }
    const q = $('#mq'); if (q) { q.value = ''; renderAc('mq'); }
    return;
  }
  addToRoster(id);
  const q = $('#addq'); if (q) { q.value = ''; D.addq = ''; renderAc('addq'); }
}

/* ---------- Roster ---------- */
function editRosterGuard() {
  if (state.sleeper) { toast('This roster syncs from Sleeper, so edits here would be replaced. Make an editable copy to experiment.', 'Make a copy', 'copyteam'); return false; }
  if (state.example) { state.example = false; const ct = curTeam(); if (ct && ct.name === 'Demo team') ct.name = 'My team'; }   // editing the demo makes it yours

}
function addToRoster(id) {
  if (state.roster.includes(id)) return toast(`${D.U.get(id)?.name || 'That player'} is already on your roster.`);
  if (!editRosterGuard()) return;
  state.roster.push(id); D.wCache = null; save(); refreshPlayers(); toast(`Added ${D.U.get(id)?.name || 'player'}.`);
}
function removeFromRoster(id) {

let toastTimer = null;
function toast(msg, action, act) {
  const el = $('#toast'); if (!el) return;
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button" class="btn sm" data-act="${act}">${esc(action)}</button>` : ''}`;
  el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, action ? 8000 : 3500);
}
const POS_ORDER = { QB: 0, RB: 1, WR: 2, TE: 3, K: 4, DEF: 5 };
function playerListHTML() {
  const view = D.rview || 'mine', pp = POS.includes(D.ppos) ? D.ppos : 'All', ros = new Set(state.roster), locked = !!state.sleeper;
  let list = view === 'mine' ? state.roster.map(id => D.U.get(id) || { id, name: `Player ${id}`, pos: '', team: '' })
    : [...D.U.values()].filter(u => D.M[u.id] && (ros.has(u.id) || D.M[u.id].mean > 1));
  if (pp !== 'All') list = list.filter(u => u.pos === pp);
  list.sort(view === 'mine' ? (a, b) => (POS_ORDER[a.pos] ?? 9) - (POS_ORDER[b.pos] ?? 9) || (D.M[b.id]?.mean || 0) - (D.M[a.id]?.mean || 0) : (a, b) => D.M[b.id].mean - D.M[a.id].mean);
  const shown = list.slice(0, 60);

    <li><strong>Matchup factors</strong>, each capped at ±25%: fantasy points the opponent allows to the position; secondary (pass yards allowed) or run defense (yards per carry allowed, plus the player’s own line); sacks allowed by the offense vs. sacks by the opposing defense; the team’s Vegas implied total and spread, with the opponent’s record; the offense’s pass rate and pace; and the opponent’s defensive roster changes (signings, trades, injuries) that its stats don’t show yet.</li>

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!n) return; D.ac.idx = (D.ac.idx + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; renderAc(t.id); }
    else if (e.key === 'Enter') { e.preventDefault(); const u = D.ac.items[D.ac.idx]; if (u) acPick(u.id, t.id === 'addq' ? 'roster' : 'manual'); }
    else if (e.key === 'Escape') { const l = $(t.id === 'addq' ? '#acList' : '#mqList'); if (l) l.hidden = true; t.setAttribute('aria-expanded', 'false'); }
  }
});
// close the suggestion list when focus leaves the search box (after a beat, so a tap on a suggestion still lands)
document.addEventListener('focusout', e => {
  const id = e.target.id; if (id !== 'addq' && id !== 'mq') return;
  setTimeout(() => { const l = $(id === 'addq' ? '#acList' : '#mqList'); if (l && !l.contains(document.activeElement) && document.activeElement?.id !== id) { l.hidden = true; e.target.setAttribute('aria-expanded', 'false'); } }, 200);

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'wOwn') { const o = $('#wOwn-v'); if (o) o.textContent = t.value + '%'; return; }
  if (t.id === 'addq') { D.addq = t.value; renderAc('addq'); return; }
  if (t.id === 'mq') { renderAc('mq'); return; }

  if (t.id === 'acctEmail') { acct.email = t.value; return; }
  if (t.id === 'acctCode') { acct.code = t.value; return; }
  if (t.id === 'psearch') { D.psearch = t.value; $('#plistBox').innerHTML = playerListHTML(); }
  else if (t.dataset.set) { const v = +t.value, o = $('#' + CSS.escape(t.id) + '-v'); if (o) o.textContent = t.id === 'priorWeeks' ? v.toFixed(1) : t.id.startsWith('w.') ? '×' + v.toFixed(1) : Math.round(v * 100) + '%'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'weekSel') { state.settings.week = +t.value; if (state.settings.week === D.detWeek && D.season === D.detSeason) state.settings.week = null; save(); D.open.clear(); load({ fresh: true }); return; }
  if (t.dataset.iosel) { const s = D.ioSkip || (D.ioSkip = new Set()); t.checked ? s.delete(t.dataset.iosel) : s.add(t.dataset.iosel); D.ioOutMsg = ''; render(); return; }
  if (t.id === 'ioReplace') { D.ioReplace = t.checked; return; }
  if (t.id === 'ioFile') {
    const f = t.files?.[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { D.drafts.code = String(rd.result || ''); const box = $('#ioIn'); if (box) box.value = D.drafts.code; if (D.flow) { D.flow.msg = ['info', `Loaded ${f.name}. Press Review.`]; render(); } };
    rd.onerror = () => { if (D.flow) { D.flow.msg = ['err', 'Couldn’t read that file.']; render(); } };
    rd.readAsText(f); return;
  }
  if (t.hasAttribute('data-teprem')) { state.tePrem = +t.value || 0; save(); if (D.inp) ingest(D.inp); D.open.clear(); render(); return; }
  if (t.hasAttribute('data-scoring')) { if (SCORING[t.value]) { state.scoring = t.value; save(); if (D.inp) ingest(D.inp); D.open.clear(); render(); } return; }
  if (t.id === 'teamName') { const ct = curTeam(), v = t.value.trim(); if (ct && v) ct.name = v; save(); render(); return; }
  if (t.dataset.rw) { const rw = state.returnWeek || (state.returnWeek = {}); if (t.value === '') delete rw[t.dataset.rw]; else rw[t.dataset.rw] = +t.value; save(); render(); return; }
  if (t.hasAttribute('data-wteams')) { state.waivers.teams = +t.value; D.wCache = null; save(); render(); return; }
  if (t.id === 'showOvr') { D.showOvr = t.checked; const b = $('#plistBox'); if (b) b.innerHTML = playerListHTML(); return; }
  if (t.id === 'wOwn') { state.waivers.ownMax = +t.value; save(); render(); return; }
  if (t.id === 'ppos') { D.ppos = t.value; const b = $('#plistBox'); if (b) b.innerHTML = playerListHTML(); return; }
  if (t.dataset.set) { const k = t.dataset.set, v = +t.value; if (k.startsWith('w.')) state.settings.w[k.slice(2)] = v; else state.settings[k] = v; save(); computeAll(); return; }
  if (t.dataset.ovr != null && t.dataset.ovr !== undefined && t.hasAttribute('data-ovr')) { const id = t.dataset.ovr; if (t.value === '') delete state.overrides[id]; else state.overrides[id] = +t.value; save(); computeAll(); state.tab === 'players' ? refreshPlayers() : render(); return; }

  if (t.hasAttribute('data-season')) { const s = Math.round(+t.value); if (s >= 2019 && s <= D.detSeason) { state.settings.season = s === D.detSeason ? null : s; state.settings.week = null; save(); load({ fresh: true }); } return; }
  if (t.dataset.espn) { state.espn[t.dataset.espn] = t.value; save(); return; }
  if (t.dataset.staff) { const [T, f] = t.dataset.staff.split('.'); const v = t.type === 'checkbox' ? t.checked : (f.endsWith('Prev') ? fixAbbr(t.value.trim().toUpperCase()) || '' : t.value); state.staffEdits[T] = Object.assign({}, state.staffEdits[T], { [f]: v }); save(); computeAll(); return; }
});
/* Matches pasted text (ESPN's roster table, or one name per line) against every player with a projection or a game played.
   Longest names are tried first so "Kenneth Walker" wins over "Ken Walker"-style partials. Used for rosters and free-agent lists. */
function matchPasted(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const live = [...D.U.values()].filter(u => (D.proj[u.id]?.pts || 0) > 0 || D.H[u.id] || D.prevPPG?.[u.id]);
  const names = live.map(u => [norm(u.name), u]).filter(([n]) => n.includes(' ') && n.length >= 6).sort((a, b) => b[0].length - a[0].length || (D.M[b[1].id]?.mean || 0) - (D.M[a[1].id]?.mean || 0));
  const ids = [], miss = [];
  for (const l of lines) {
    const k = norm(l); if (k.length < 4 || /^\d/.test(k)) continue;
    let u = (D.nameIdx.get(k) || []).map(id => D.U.get(id)).sort((a, b) => (D.M[b.id]?.mean || 0) - (D.M[a.id]?.mean || 0))[0];
    if (!u) u = names.find(([n]) => k.includes(n))?.[1];
    if (!u && /d\/?st|defense|\bdef\b/.test(k)) { const T = ABBR.find(a => k.includes(TEAMS[a][1].toLowerCase())); if (T) u = D.U.get(T); }
    if (u) { if (!ids.includes(u.id)) ids.push(u.id); } else if (/[a-z]{2,} [a-z]{2,}/.test(k) && k.length < 40) miss.push(l);
  }
  return { ids, miss };
}
function applyCsv() {
  const lines = ($('#csv')?.value || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean); let n = 0; const miss = [];
  for (const l of lines) {
    const m = /^(.+?)[,\t;]\s*(-?\d+(?:\.\d+)?)\s*$/.exec(l); if (!m) { miss.push(l); continue; }
    const k = norm(m[1]); let c = D.nameIdx.get(k) || [];
    if (!c.length) { const hit = [...D.nameIdx.keys()].filter(x => x.includes(k)); if (hit.length === 1) c = D.nameIdx.get(hit[0]); }
    if (!c.length) { miss.push(m[1]); continue; }
    const id = c.find(x => state.roster.includes(x)) || c.sort((a, b) => (D.M[b]?.mean || 0) - (D.M[a]?.mean || 0))[0];
    state.overrides[id] = +m[2]; n++;
  }
  save(); computeAll();
  D.csvMsg = `Applied ${n} override${n === 1 ? '' : 's'}.` + (miss.length ? ` Not matched: ${miss.slice(0, 6).join(', ')}${miss.length > 6 ? '…' : ''}` : '');
  render();
}
