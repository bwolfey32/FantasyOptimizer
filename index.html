<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start/Sit Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a coach's call sheet. One column of lineup rows on chalk-green paper, numbers set in a condensed jersey face, turf green as the only accent. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --surface-2: #e3e9e4;
  --ink: #13201a;
  --muted: #56655d;
  --line: #cfd8d1;
  --accent: #176a49;
  --accent-ink: #ffffff;
  --good: #1b7a4b;
  --bad: #b23a30;
  --warn: #a8670f;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1512; --surface: #151e1a; --surface-2: #1c2722; --ink: #e4ebe6; --muted: #91a198;
    --line: #29352f; --accent: #4fc38e; --accent-ink: #07130d; --good: #4fc38e; --bad: #f07a6e; --warn: #e3b052;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1512; --surface: #151e1a; --surface-2: #1c2722; --ink: #e4ebe6; --muted: #91a198;
  --line: #29352f; --accent: #4fc38e; --accent-ink: #07130d; --good: #4fc38e; --bad: #f07a6e; --warn: #e3b052;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 56px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 30px; text-transform: uppercase; }
h2 { font-size: 22px; text-transform: uppercase; }
h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .03em; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand .hash { display: flex; gap: 5px; margin-bottom: 4px; }
.brand .hash i { width: 14px; height: 3px; background: var(--accent); border-radius: 1px; }
.brand .hash i:nth-child(n+2) { opacity: .45; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sel, .inp { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.inp:focus, .sel:focus { border-color: var(--accent); outline: none; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.danger { color: var(--bad); }

/* Tabs */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; font-family: var(--font-display); font-size: 17px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.banner { border: 1px solid var(--line); border-left: 4px solid var(--warn); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.banner.info { border-left-color: var(--accent); }
.banner.err { border-left-color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.wrap > *, .section > *, #main { min-width: 0; max-width: 100%; }
.banner { overflow-wrap: anywhere; }
.section { display: flex; flex-direction: column; gap: 10px; }
.row-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.summary > div { background: var(--surface); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.summary .big { font-size: 34px; line-height: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Fantasy team headers */
.teambar { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tteams { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tteam { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 128px; max-width: 220px; padding: 8px 14px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; text-align: left; }
.tteam:hover { border-color: var(--accent); }
.tteam .tn { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.15; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tteam .tm { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.tteam .tm .num { color: var(--ink); }
.tteam[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); box-shadow: inset 0 -3px 0 var(--accent); }
.tteam.add { min-width: 0; justify-content: center; align-items: center; border-style: dashed; color: var(--accent); font-weight: 600; }
.tmanage { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tmanage .inp { flex: 0 1 220px; }

/* Lineup rows */
.list { display: flex; flex-direction: column; }
.list .item + .item { border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 54px minmax(0, 1.5fr) minmax(0, 1.25fr) 38px 64px 86px 58px; align-items: center; gap: 12px; padding: 10px 14px; width: 100%; background: none; border: 0; text-align: left; }
.prow:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.lhead { padding-block: 8px; }
.lhead:hover { background: none; }
.slot { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .04em; color: var(--accent); }
.slot.bench { color: var(--muted); }
.pname { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.psub { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.match { font-size: 13px; min-width: 0; }
.match .opp { font-weight: 600; }
.proj { font-size: 24px; text-align: right; line-height: 1; }
.range { font-size: 13px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.pav { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
.grade { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; border: 1px solid var(--line); }
.g-A { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.g-B { background: color-mix(in srgb, var(--good) 10%, transparent); color: var(--good); }
.g-C { color: var(--muted); }
.g-D { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
.g-F { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; line-height: 1.4; white-space: nowrap; }
.pill.q { color: var(--warn); }
.pill.o { color: var(--bad); }
.pill.n { color: var(--accent); }
.pill.m { color: var(--muted); }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.up { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.chip.down { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }

/* Detail */
.detail { padding: 4px 14px 16px 80px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
.factors { display: flex; flex-direction: column; gap: 9px; }
.factor { display: grid; grid-template-columns: minmax(0, 1fr) 120px 48px; gap: 10px; align-items: center; }
.factor .fl { font-weight: 600; font-size: 13.5px; }
.factor .fn { font-size: 12.5px; color: var(--muted); }
.fbar { position: relative; height: 10px; background: var(--surface-2); border-radius: 3px; }
.fbar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.fbar span { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.fbar .pos { left: 50%; background: var(--good); }
.fbar .neg { right: 50%; background: var(--bad); }
.fv { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
.scheme { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.probs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.probs > div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.probs .num { font-size: 22px; line-height: 1; }
.math { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ovr { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.ovr input { width: 84px; }

/* Tables */
.tscroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--surface); position: sticky; top: 0; }
th[data-sort] { cursor: pointer; }
th[data-sort]:hover { color: var(--ink); }
td:first-child, th:first-child, td.l, th.l { text-align: left; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.spark { display: inline-block; vertical-align: middle; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.spark .area { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: none; }
.spark circle { fill: var(--accent); }
.trend-up { color: var(--good); }
.trend-down { color: var(--bad); }

/* Compare */
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cmp .card { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.verdict { padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; }
.verdict .num { font-size: 40px; line-height: 1; color: var(--accent); }
.meter { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; display: flex; flex: 1 1 200px; }
.meter span { background: var(--accent); }

/* Players / settings */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.panel { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.inline { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
.slider { display: grid; grid-template-columns: minmax(0, 1fr) 140px 46px; gap: 10px; align-items: center; font-size: 14px; }
.slider input { width: 100%; accent-color: var(--accent); }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.slots label { display: flex; justify-content: space-between; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 13.5px; font-weight: 600; }
.slots input { width: 46px; }
textarea.inp { width: 100%; min-height: 90px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.staff input[type=text] { width: 140px; padding: 4px 6px; }
.staff input.ab { width: 52px; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }
.loading .bar { height: 4px; max-width: 320px; margin: 12px auto 0; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.loading .bar span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
details.how summary { cursor: pointer; font-weight: 600; }
details.how { font-size: 14px; }
details.how p, details.how li { max-width: 72ch; }

/* Scheme matchup */
.schemes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.side { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; background: var(--surface); }
.tend { margin: 0; padding-left: 18px; font-size: 13px; display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }

/* Waivers */
.needs { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.need { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.move { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr) 120px; grid-template-areas: "rank add drop gain" "rank why why why"; gap: 8px 14px; padding: 12px 14px; align-items: start; }
.move .mrank { grid-area: rank; font-size: 22px; color: var(--muted); line-height: 1.2; }
.move .mside { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px 8px; min-width: 0; }
.move .mside:nth-of-type(2) { grid-area: add; }
.move .mside:nth-of-type(3) { grid-area: drop; }
.move .mside > div { min-width: 0; flex: 1 1 140px; }
.move .mgain { grid-area: gain; display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
.move .mgain .num { font-size: 28px; line-height: 1; color: var(--good); }
.move .mwhy { grid-area: why; color: var(--muted); }
.prs { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 6px 14px; padding: 10px 14px; align-items: start; }
.prs .pteam { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.prs .pbody { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.prs .pchips { display: flex; flex-wrap: wrap; gap: 4px; }
.prs .chip { white-space: normal; }
.prs-more { padding: 0; }
.prs-more > summary { padding: 10px 14px; cursor: pointer; color: var(--accent); font-weight: 600; }
.prs-more .prs { border-top: 1px solid var(--line); }
.wk .pmark { font-style: normal; margin-left: 2px; color: var(--ink); }
@media (max-width: 780px) { .prs { grid-template-columns: minmax(0, 1fr); } }
.stash { display: grid; grid-template-columns: minmax(0, 1.6fr) auto minmax(0, 1fr) auto; gap: 8px 14px; align-items: center; padding: 10px 14px; }
.stash .sinfo { display: flex; flex-direction: column; min-width: 0; }
.stash .sctl { display: flex; align-items: center; gap: 6px; }
@media (max-width: 780px) { .stash { grid-template-columns: minmax(0, 1fr) auto; } .stash .sinfo { grid-column: 1 / -1; } }
.move .mwhy .btn { margin-left: 6px; }
.wks { display: flex; flex-wrap: wrap; gap: 3px; flex-basis: 100%; }
.wk { font-size: 11px; font-variant-numeric: tabular-nums; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
.wk.bye { color: var(--muted); border-style: dashed; }
td .wks { flex-wrap: nowrap; }

@media (max-width: 780px) {
  .move { grid-template-columns: 24px minmax(0, 1fr) 92px; grid-template-areas: "rank add gain" "rank drop drop" "rank why why"; }
  .prow { grid-template-columns: 44px minmax(0, 1fr) 38px 58px; grid-template-areas: "slot name grade proj" "slot match match range"; row-gap: 4px; }
  .prow > .slot { grid-area: slot; align-self: start; padding-top: 2px; }
  .prow > .pwho { grid-area: name; min-width: 0; }
  .prow > .match { grid-area: match; }
  .prow > .grade { grid-area: grade; }
  .prow > .proj { grid-area: proj; }
  .prow > .range { grid-area: range; }
  .prow > .pav { display: none; }
  .lhead { display: none; }
  .detail { padding: 4px 14px 16px; grid-template-columns: minmax(0, 1fr); }
  .factor { grid-template-columns: minmax(0, 1fr) 80px 44px; }
  .cmp, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .slider { grid-template-columns: minmax(0, 1fr) 110px 40px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="hash" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <h1>Start/Sit Board</h1>
      <div class="small muted" id="asof">ESPN PPR · loading data…</div>
    </div>
    <div class="controls">
      <label class="small muted" for="weekSel">Week</label>
      <select id="weekSel" class="sel"></select>
      <button class="btn" data-act="reload" type="button">Refresh data</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="msgs" class="section"></div>
  <main id="main"></main>
</div>

<script>
'use strict';
/* ---------- constants ---------- */
const TEAMS = {ARI:[22,'Cardinals'],ATL:[1,'Falcons'],BAL:[33,'Ravens'],BUF:[2,'Bills'],CAR:[29,'Panthers'],CHI:[3,'Bears'],CIN:[4,'Bengals'],CLE:[5,'Browns'],DAL:[6,'Cowboys'],DEN:[7,'Broncos'],DET:[8,'Lions'],GB:[9,'Packers'],HOU:[34,'Texans'],IND:[11,'Colts'],JAX:[30,'Jaguars'],KC:[12,'Chiefs'],LV:[13,'Raiders'],LAC:[24,'Chargers'],LAR:[14,'Rams'],MIA:[15,'Dolphins'],MIN:[16,'Vikings'],NE:[17,'Patriots'],NO:[18,'Saints'],NYG:[19,'Giants'],NYJ:[20,'Jets'],PHI:[21,'Eagles'],PIT:[23,'Steelers'],SF:[25,'49ers'],SEA:[26,'Seahawks'],TB:[27,'Buccaneers'],TEN:[10,'Titans'],WAS:[28,'Commanders']};
const ABBR = Object.keys(TEAMS);
const ESPN_TO_ABBR = Object.fromEntries(ABBR.map(a => [TEAMS[a][0], a]));
const fixAbbr = a => a ? ({WSH:'WAS', JAC:'JAX', LA:'LAR', OAK:'LV', SD:'LAC', STL:'LAR'}[a] || a) : null;
const POS = ['QB','RB','WR','TE','K','DEF'];
const POSQ = POS.map(p => 'position[]=' + p).join('&');
const API = {
  sbHosts: ['https://site.web.api.espn.com', 'https://site.api.espn.com'],
  sbPath: (s, w) => '/apis/site/v2/sports/football/nfl/scoreboard' + (w ? `?week=${w}&seasontype=2&dates=${s}` : ''),
  state: 'https://api.sleeper.app/v1/state/nfl',
  proj: (s, w) => `https://api.sleeper.com/projections/nfl/${s}/${w}?season_type=regular&${POSQ}`,
  wk: (s, w) => `https://api.sleeper.com/stats/nfl/${s}/${w}?season_type=regular&${POSQ}`,
  tot: s => `https://api.sleeper.com/stats/nfl/${s}?season_type=regular&${POSQ}`,
  wkQB: (s, w) => `https://api.sleeper.com/stats/nfl/${s}/${w}?season_type=regular&position[]=QB`,
  sched: s => `https://api.sleeper.com/schedule/nfl/regular/${s}`,
  idp: s => `https://api.sleeper.com/stats/nfl/${s}?season_type=regular&position[]=DL&position[]=LB&position[]=DB`,
  own: s => `https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/${s}/segments/0/leaguedefaults/3?view=players_wl`,

/* Matches pasted text (ESPN's roster table, or one name per line) against every player with a projection or a game played.
   Longest names are tried first so "Kenneth Walker" wins over "Ken Walker"-style partials. */
function pasteRoster() {
  const lines = ($('#rosterPaste')?.value || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const live = [...D.U.values()].filter(u => (D.proj[u.id]?.pts || 0) > 0 || D.H[u.id] || D.prevPPG?.[u.id]);
  const names = live.map(u => [norm(u.name), u]).filter(([n]) => n.includes(' ') && n.length >= 6).sort((a, b) => b[0].length - a[0].length || (D.M[b[1].id]?.mean || 0) - (D.M[a[1].id]?.mean || 0));
  const ids = [], miss = [];
  for (const l of lines) {
    const k = norm(l); if (k.length < 4 || /^\d/.test(k)) continue;
    let u = (D.nameIdx.get(k) || []).map(id => D.U.get(id)).sort((a, b) => (D.M[b.id]?.mean || 0) - (D.M[a.id]?.mean || 0))[0];
    if (!u) u = names.find(([n]) => k.includes(n))?.[1];
    if (!u && /d\/?st|defense|\bdef\b/.test(k)) { const T = ABBR.find(a => k.includes(TEAMS[a][1].toLowerCase())); if (T) u = D.U.get(T); }
    if (u) { if (!ids.includes(u.id)) ids.push(u.id); } else if (/[a-z]{2,} [a-z]{2,}/.test(k) && k.length < 40) miss.push(l);
  }
  if (ids.length) { state.roster = ids; state.example = false; state.espn.slotOf = {}; save(); }
  D.rosterMsg = ids.length ? `Set ${ids.length} players.` + (miss.length ? ` Not matched: ${miss.slice(0, 5).join(', ')}${miss.length > 5 ? '…' : ''}. Add them with the search below.` : '') : 'No player names found in that text.';
  render();
}

  const live = [...D.U.values()].filter(u => (D.proj[u.id]?.pts || 0) > 0 || D.H[u.id] || D.prevPPG?.[u.id]);
  const names = live.map(u => [norm(u.name), u]).filter(([n]) => n.includes(' ') && n.length >= 6).sort((a, b) => b[0].length - a[0].length || (D.M[b[1].id]?.mean || 0) - (D.M[a[1].id]?.mean || 0));
  const ids = [], miss = [];
  for (const l of lines) {
    const k = norm(l); if (k.length < 4 || /^\d/.test(k)) continue;
    let u = (D.nameIdx.get(k) || []).map(id => D.U.get(id)).sort((a, b) => (D.M[b.id]?.mean || 0) - (D.M[a.id]?.mean || 0))[0];
    if (!u) u = names.find(([n]) => k.includes(n))?.[1];
    if (!u && /d\/?st|defense|\bdef\b/.test(k)) { const T = ABBR.find(a => k.includes(TEAMS[a][1].toLowerCase())); if (T) u = D.U.get(T); }
    if (u) { if (!ids.includes(u.id)) ids.push(u.id); } else if (/[a-z]{2,} [a-z]{2,}/.test(k) && k.length < 40) miss.push(l);
