<style>
/* Layout: a coach's call sheet. One column of lineup rows on chalk-green paper, numbers set in a condensed jersey face, turf green as the only accent. */
:root {
  --bg: #eef2ee;
  --surface: #ffffff;
  --surface-2: #e3e9e4;
  --ink: #13201a;
  --muted: #4a5850;
  --line: #cfd8d1;
  --accent: #075b37;
  --gold: #8a6510;
  --accent-ink: #ffffff;
  --good: #1b7a4b;
  --bad: #b23a30;
  --warn: #a8670f;
  --font-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 10px;
  --sleeper-tint: #e3eaf5; --sleeper-ink: #022047; --espn-tint: #fbe7e8; --espn-ink: #8f0009;   /* the setup tabs, in each platform's colors */
  --wx-tile: #123d2a;   /* weather icons are drawn light-on-dark, so on the light theme each sits on a dark tile */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1512; --surface: #151e1a; --surface-2: #1c2722; --ink: #e4ebe6; --muted: #a9b7af;
    --line: #29352f; --accent: #4fc38e; --accent-ink: #07130d; --good: #4fc38e; --bad: #f07a6e; --warn: #e3b052; --gold: #e2bb52;
    --sleeper-tint: #1b2a45; --sleeper-ink: #c4d4ea; --espn-tint: #3d1517; --espn-ink: #ffb4b8; --wx-tile: transparent;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1512; --surface: #151e1a; --surface-2: #1c2722; --ink: #e4ebe6; --muted: #a9b7af;
  --line: #29352f; --accent: #4fc38e; --accent-ink: #07130d; --good: #4fc38e; --bad: #f07a6e; --warn: #e3b052; --gold: #e2bb52;
  --sleeper-tint: #1b2a45; --sleeper-ink: #c4d4ea; --espn-tint: #3d1517; --espn-ink: #ffb4b8; --wx-tile: transparent;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 1100px; min-height: 100vh; min-height: 100dvh; margin: 0 auto; padding-inline: 16px; padding-block: 18px 56px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 30px; text-transform: uppercase; }
h2 { font-size: 22px; text-transform: uppercase; }
h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .03em; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .mark { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; }
.brand .logo { flex: 0 0 auto; width: 56px; height: 56px; object-fit: contain; }
.wordmark { display: flex; flex-direction: column; min-width: 0; }
.wordmark h1 { font-size: 32px; }
.tagline { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.status { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13.5px; color: var(--muted); margin-right: 4px; background: none; border: 1px solid transparent; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.status:hover { border-color: var(--line); color: var(--ink); }
.freshp { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.freshp table { font-size: 14px; }
.freshp td { white-space: normal; vertical-align: top; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.live i { background: var(--good); }
.status.busy i { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
.status.old i { background: var(--warn); }
@keyframes pulse { 50% { opacity: .3; } }

/* This week at a glance */
.brief { background: var(--surface); border: 1.8px solid var(--accent); border-radius: var(--radius); padding: 12px 16px; font-size: 16px; line-height: 1.6; }
.brief:empty { display: none; }
.brief .bteam { font-weight: 600; }
.brief .sep { color: var(--muted); margin: 0 6px; }
.blink { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; border-bottom: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.blink:hover { border-bottom-color: var(--accent); }
.blink .n { font-family: var(--font-display); font-weight: 700; font-size: 21px; font-variant-numeric: tabular-nums; }
.blink .n.up { color: var(--good); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sel, .inp { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.inp:focus, .sel:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.danger { color: var(--bad); }

/* Tabs */
/* the six main tabs sit in a solid green band, so they read as navigation rather than another row of buttons;
   light labels, the current tab a lighter raised pill, and a short white underline under each label */
.tabs { display: flex; gap: 4px; padding: 6px; border-radius: 12px; background: linear-gradient(160deg, #0a6b41, #054a2c); box-shadow: 0 2px 8px rgba(0, 0, 0, .15); }
.tabs .navlink { position: relative; flex: 1 1 0; display: grid; place-items: center; min-height: 46px; padding: 8px 14px 10px; border-radius: 8px; text-decoration: none; font-family: var(--font-display); font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; line-height: 1.1; color: rgba(255, 255, 255, .78); white-space: nowrap; text-align: center; }
.tabs .navlink:hover { color: #fff; background: rgba(255, 255, 255, .07); }
.tabs .navlink[aria-current="page"] { color: #fff; background: rgba(255, 255, 255, .17); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .7), 0 1px 3px rgba(0, 0, 0, .25); }
.tabs .navlink::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 22px; height: 2px; margin-left: -11px; border-radius: 2px; background: rgba(255, 255, 255, .45); }
.tabs .navlink[aria-current="page"]::after { width: 32px; margin-left: -16px; background: #fff; }
#acctBtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
#acctBtn { display: inline-flex; align-items: center; gap: 7px; }
#acctBtn i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
#acctBtn .acct-ico { display: none; }
#acctBtn i.busy { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
#acctBtn i.err, #acctBtn i.wait { background: var(--warn); }
.acct-form { display: flex; flex-wrap: wrap; gap: 8px; }
.acct-form .inp { flex: 1 1 220px; max-width: 360px; }
.acct-or { display: flex; align-items: center; gap: 10px; max-width: 520px; color: var(--muted); font-size: 13px; }
.acct-or::before, .acct-or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.acct-choice { display: flex; flex-wrap: wrap; gap: 8px; }
.gbtn { display: inline-flex; align-items: center; gap: 10px; }
.gbtn svg { flex: none; }
.hist .hdet > td { padding: 4px 10px 12px; background: var(--surface-2); }
.hist .hdet table { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
.hist .hbench td { color: var(--muted); }
/* Pro: header button, lock lines, the Pro page */
.gopro { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); color: var(--gold); font-weight: 600; }
.gopro.is-pro { color: var(--accent); border-color: var(--accent); }
.gopro[aria-pressed="true"] { background: color-mix(in srgb, var(--gold) 10%, var(--surface)); }
/* Pro and Account / Sign in sit together as one control in the header, Pro first */
.acct-grp { display: inline-flex; align-items: stretch; }
.acct-grp .gopro:not([hidden]) + #acctBtn { margin-left: -1px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.acct-grp .gopro:has(+ #acctBtn:not([hidden])) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.acct-grp .gopro { background: color-mix(in srgb, var(--gold) 10%, var(--surface)); }
/* phones: Pro / Account go top right beside the logo; the data status and Refresh share the row below */
@media (max-width: 600px) {
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 8px; }
  .top > .controls { display: contents; }
  .top .acct-grp { grid-column: 2; grid-row: 1; }
  .top .acct-grp .btn { padding: 6px 10px; }
  .top #status { grid-column: 1; grid-row: 2; justify-self: start; margin-right: 0; }
  .top [data-act="reload"] { grid-column: 2; grid-row: 2; justify-self: end; }
  .brand { gap: 10px; }
  .brand .logo { width: 44px; height: 44px; }
  .tagline { font-size: 10.5px; letter-spacing: .1em; }
  .wordmark h1, .tagline, .top #status { white-space: nowrap; }
  .top [data-act="reload"] { padding: 6px 10px; }
}
@media (max-width: 400px) {
  #acctBtn .acct-ico { display: block; }
  .top .wordmark h1 { font-size: 22px; }
  .brand { gap: 8px; }
  .brand .logo { width: 40px; height: 40px; }
  .top .acct-grp .btn { padding: 6px 8px; }
  .acct-txt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tagline { font-size: 9.5px; }
  .top #status { font-size: 12.5px; padding: 4px 4px; }
}
.acct-grp .gopro.is-pro { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.acct-grp .btn:hover, .acct-grp .btn[aria-expanded="true"], .acct-grp .gopro[aria-pressed="true"] { position: relative; z-index: 1; }
.lock { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 10px 14px; border: 1px dashed color-mix(in srgb, var(--gold) 55%, var(--line)); border-radius: 8px; background: color-mix(in srgb, var(--gold) 6%, var(--surface)); color: var(--ink); text-decoration: none; font-size: 14px; }
.lock:hover { border-style: solid; }
.lock-txt { font-weight: 600; }
.lock-cta { margin-left: auto; color: var(--gold); font-weight: 600; font-size: 13px; }
.lock-row { padding: 10px 14px; }
.decisions .lock { padding: 3px 10px; font-size: 13px; }
.tchip.locked { color: var(--muted); text-decoration: none; }
.acct-plan { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 14.5px; }
.pro-page { max-width: 820px; }
.pro-hero h2 { font-size: 32px; margin-top: 2px; }
.pro-hero p { margin: 8px 0 0; font-size: 16px; max-width: 62ch; }
.pro-hero .label { color: var(--gold); }
.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.plan { position: relative; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
.plan p { margin: 0 0 6px; }
.plan.best { border: 2px solid var(--accent); box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 15%, transparent); }
.plan-tag { position: absolute; top: -10px; right: 14px; background: var(--surface); }
.price { font-size: 40px; line-height: 1; }
.price span { font-size: 15px; color: var(--muted); font-family: var(--font-body); font-weight: 400; }
.plan .btn { margin-top: auto; padding: 10px 14px; }
.pro-feats { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.pro-feats li { display: flex; flex-direction: column; padding-left: 26px; position: relative; }
.pro-feats li::before { content: "✓"; position: absolute; left: 2px; top: 0; color: var(--good); font-weight: 700; }
@media (max-width: 600px) { .plans { grid-template-columns: minmax(0, 1fr); } .pro-hero h2 { font-size: 26px; } .lock-cta { margin-left: 0; } }
/* Team Grade and Benny's Moves */
.gm-row { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 2fr); gap: 12px; align-items: start; }
.grade-card { padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.gc-letter { grid-row: span 2; width: 64px; height: 64px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 34px; border: 1px solid var(--line); }
.gc-score { font-size: 30px; line-height: 1; }
.gc-pos { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.moves-card { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.mv-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.mv { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 9px 0; }
.mv + .mv { border-top: 1px solid var(--line); }
.mv-n { font-size: 20px; color: var(--accent); line-height: 1.2; }
.mv-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mv-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.mv-gain { color: var(--good); font-size: 17px; white-space: nowrap; }
@media (max-width: 780px) { .gm-row { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 600px) { .mv { grid-template-columns: 20px minmax(0, 1fr); } .mv-side { grid-column: 2; flex-direction: row; align-items: center; justify-content: space-between; } }
/* Ad slot and footer */
.adslot { min-height: 100px; display: flex; flex-direction: column; justify-content: center; }
.adslot .ad-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.adslot ins { min-height: 90px; }
.house { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: color-mix(in srgb, var(--gold) 5%, var(--surface)); color: var(--ink); text-decoration: none; }
.house .ad-label { flex-basis: 100%; color: var(--gold); }
.house strong { font-size: 16px; }
.house .btn { margin-left: auto; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line); }   /* kept at the bottom of the page on short pages */
.foot a { color: var(--muted); }
body.welcome .adslot { display: none !important; }
/* Welcome walkthrough: full screen, no navigation */
body.welcome .controls, body.welcome #tabs, body.welcome #teamctx, body.welcome #panels, body.welcome #brief, body.welcome #msgs, body.welcome #fresh { display: none !important; }
body.welcome.wpro #panels { display: block !important; }   /* the sign-in panel when buying Pro before setting up a team */
/* on the welcome, Sign in sits top right in the header (only that button), in place of the link above the headline */
body.welcome.wsign .top { align-items: center; }
body.welcome.wsign .top > .controls { display: flex !important; }
body.welcome.wsign .top #status, body.welcome.wsign .top [data-act="reload"], body.welcome.wsign #proBtn, body.welcome.wsign .wl-top { display: none !important; }
body.welcome.wsign #acctBtn { margin-left: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
body.welcome.wsign #acctBtn:hover, body.welcome.wsign #acctBtn[aria-expanded="true"] { background: color-mix(in srgb, var(--accent) 85%, var(--ink)); border-color: color-mix(in srgb, var(--accent) 85%, var(--ink)); color: var(--accent-ink); }
body.welcome.wsign #acctBtn .acct-ico { display: none; }
body.welcome.wsign #acctBtn .acct-txt { position: static; width: auto; height: auto; overflow: visible; clip: auto; }
@media (max-width: 600px) { body.welcome.wsign .top > .controls { display: contents !important; } }
.wl-back { font-size: 14.5px; }
.wl { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.wl-top { display: flex; justify-content: flex-end; min-height: 22px; font-size: 14.5px; }
.wl-hero h2 { font-size: 38px; line-height: 1.05; }
.wl-hero p { margin: 10px 0 0; font-size: 16.5px; max-width: 62ch; }
/* the landing reads centered on wider screens; phones keep the left-aligned stack */
@media (min-width: 681px) {
  .wl-hero, .wl-q, .wl-alt, .wl-legal { text-align: center; } .wl-hero p { margin-inline: auto; }
  /* the choice of how to add a team sits in the middle of the space between header and footer, a little above center */
  body.welcome #main:has(.wl-methods) { flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; padding-bottom: 6vh; }
  body.welcome #main:has(.wl-methods) .wl { gap: 24px; } body.welcome #main:has(.wl-methods) .wl-hero p { margin-top: 14px; }
}
.wl-q { font-size: 22px; margin-top: 8px; }
.wl-methods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
/* each card in its platform's colors (Sleeper navy, ESPN red); Find your players in Benny's green */
.wl-method { --wl-bg: #075b37; --wl-fg: #ffffff; --wl-ico: #ffffff; position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px 44px 18px 16px; text-align: left; color: var(--wl-fg); border: 1px solid color-mix(in srgb, var(--wl-bg) 70%, #000); border-radius: var(--radius);
  background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--wl-bg) 80%, #fff) 0%, transparent 60%), linear-gradient(150deg, var(--wl-bg) 35%, color-mix(in srgb, var(--wl-bg) 72%, #000) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 1px 2px rgba(0, 0, 0, .12), 0 4px 12px color-mix(in srgb, var(--wl-bg) 25%, transparent); transition: box-shadow .2s, transform .2s; }
.wl-method.wl-sleeper { --wl-bg: #022047; --wl-fg: #ffffff; --wl-ico: #98b3d6; }
.wl-method.wl-espn { --wl-bg: #b0000b; --wl-fg: #ffffff; --wl-ico: #ffffff; }
.wl-method:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2), 0 2px 4px rgba(0, 0, 0, .12), 0 10px 24px color-mix(in srgb, var(--wl-bg) 40%, transparent); transform: translateY(-2px); }
.wl-method:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wl-method .muted { color: inherit; opacity: .85; }
/* the card's icon again, large and faint in the corner, and an arrow that nudges forward on hover */
.wl-mark { position: absolute; right: -14px; bottom: -22px; z-index: -1; color: var(--wl-fg); opacity: .05; transition: transform .3s; }
.wl-mark svg { width: 120px; height: 120px; stroke-width: 1.5; }
.wl-method:hover .wl-mark { transform: rotate(-6deg) scale(1.05); }
.wl-go { position: absolute; top: 16px; right: 14px; display: grid; opacity: .75; transition: transform .2s, opacity .2s; }
.wl-go svg { width: 20px; height: 20px; }
.wl-method:hover .wl-go { transform: translateX(3px); opacity: 1; }
@media (prefers-reduced-motion: reduce) { .wl-method, .wl-mark, .wl-go { transition: none; } .wl-method:hover, .wl-method:hover .wl-mark, .wl-method:hover .wl-go { transform: none; } }
.wl-ico { flex: none; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--wl-fg) 14%, transparent); color: var(--wl-ico); }
.wl-ico img { width: 32px; height: 32px; object-fit: contain; }
.wl-mt { display: flex; flex-direction: column; gap: 2px; font-size: 16.5px; }

.wl-loading { align-items: flex-start; }
.wl-loading .bar { width: 100%; max-width: 320px; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.wl-loading .bar span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
@media (max-width: 680px) { .wl-methods { grid-template-columns: minmax(0, 1fr); grid-auto-rows: 1fr; } .wl-method { flex-direction: row; align-items: center; gap: 12px; padding: 12px 44px 12px 14px; } .wl-go { top: 50%; margin-top: -10px; } .wl-mark { right: 24px; bottom: -34px; } .wl-mark svg { width: 96px; height: 96px; } }
@media (max-width: 600px) { .wl-hero h2 { font-size: 30px; } .wl-top { justify-content: flex-start; } }
.wxt td { white-space: normal; vertical-align: middle; }

@media (max-width: 600px) {
  .wxt, .wxt tbody, .wxt tr, .wxt td { display: block; }

  .wxt tr { padding: 10px 12px; border-bottom: 1px solid var(--line); }

  .wxt td { border: 0; padding: 1px 0; min-width: 0 !important; white-space: normal !important; }
  .wxt td:first-child { font-size: 12.5px; color: var(--muted); }
  .wxt td:empty { display: none; }
}
@media (max-width: 600px) { .hist th, .hist td { padding: 6px 6px; } .hist .hdet > td { padding: 4px 4px 10px; } }
/* phones: the same band as a 3 x 2 grid */
@media (max-width: 600px) {
  .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tabs .navlink { min-height: 42px; padding: 6px 4px 8px; letter-spacing: .02em; }
}

/* Team context bar (every page) */
.teamctx { display: flex; flex-direction: column; gap: 8px; }
.teamctx:empty { display: none; }
.tb-teams { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tchip { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; max-width: 220px; padding: 5px 12px 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; text-align: left; }
.tchip:hover { border-color: var(--accent); }
.tchip .tn { font-family: var(--font-display); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tchip .tm { font-size: 12.5px; color: var(--muted); }
.tchip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); box-shadow: inset 0 0 0 .8px var(--accent); }
.tchip.add { justify-content: center; align-items: center; border-style: dashed; color: var(--accent); font-weight: 600; }
.tb-ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 14px; }
.tb-item { display: inline-flex; align-items: center; gap: 6px; }
.tb-item + .tb-item::before { content: "·"; color: var(--muted); margin-right: 8px; }
.tb-actions { display: inline-flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.sel.sm { padding: 3px 6px; }
.src { display: inline-flex; align-items: center; gap: 6px; }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.hsub { font-family: var(--font-body); font-size: 14px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); }
@media (max-width: 600px) { .tb-actions { margin-left: 0; width: 100%; } }

/* Panels: setup flow, team settings, share */
#panels:empty { display: none; }
.flow, .tsp, .io, .acct, .hist { scroll-margin-top: 12px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); }
.seg.methods { display: grid; grid-template-columns: repeat(4, auto); max-width: 100%; }
@media (max-width: 600px) { .seg.methods { grid-template-columns: repeat(2, minmax(0, 1fr)); align-self: stretch; } }
.flow .seg, .tsp .seg { align-self: flex-start; }
.seg a { padding: 6px 14px; font-weight: 500; font-size: 14px; text-decoration: none; color: var(--ink); }

.seg.sub { align-self: flex-start; }
.flow-body { display: flex; flex-direction: column; gap: 10px; }

.ts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 18px; }
.rv-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px 24px; }

.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchips .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 4px 2px 10px; }
.chip-x { background: none; border: 0; font-size: 16px; line-height: 1; padding: 0 4px; color: var(--muted); cursor: pointer; }
.chip-x:hover { color: var(--bad); }
@media (max-width: 780px) { .rv-grid { grid-template-columns: minmax(0, 1fr); } }

/* Player search with suggestions */
.ac { position: relative; }
.ac .inp { width: 100%; }
.ac-list { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 28px rgba(0, 0, 0, .18); max-height: 340px; overflow-y: auto; }
.ac-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 8px 12px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; }
.ac-item:last-child { border-bottom: 0; }
.ac-item[aria-selected="true"], .ac-item:hover { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.ac-main { display: flex; flex-direction: column; min-width: 0; }

.ac-tag.on { color: var(--muted); }
.ac-empty { padding: 10px 12px; }
.ac-head { padding: 7px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); position: sticky; top: 0; }

.ac-pick .inp:focus { cursor: text; }
.ac-caret { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: grid; color: var(--muted); pointer-events: none; transition: transform .15s; }
.ac-pick .inp[aria-expanded="true"] + .ac-caret { transform: translateY(-50%) rotate(180deg); }
.addbox { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) 56px 34px auto auto; gap: 10px; align-items: center; padding: 8px 14px; }
.rrow .rr-proj { font-size: 20px; text-align: right; }
.rrow .rr-ovr { width: 92px; }
.rrow [aria-disabled="true"] { opacity: .55; }
.empty-row { padding: 14px; }
.rlinks { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 6px; }
.empty { gap: 10px; }
.flash { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }

/* Toast (Undo and quick confirmations) */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: flex; align-items: center; gap: 12px; max-width: min(560px, calc(100vw - 32px)); padding: 10px 12px 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); box-shadow: 0 10px 28px rgba(0, 0, 0, .25); font-size: 14.5px; }
.toast .btn { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 45%, transparent); }

.banner { border: 1.8px solid var(--warn); background: var(--surface); border-radius: 8px; padding: 10px 14px; font-size: 14px; }
.banner.info { border-color: var(--accent); }
.banner.err { border-color: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.wrap > *, .section > *, #main { min-width: 0; max-width: 100%; }
.banner { overflow-wrap: anywhere; }
.section { display: flex; flex-direction: column; gap: 10px; }
.row-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }

/* Summary strip */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.summary > div { background: var(--surface); padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.summary .big { font-size: 34px; line-height: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; font-weight: 500; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
/* the setup tabs show where the team comes from in that platform's colors; green stays for the main action */
.seg.methods [data-flowmethod="sleeper"][aria-pressed="true"] { background: var(--sleeper-tint); color: var(--sleeper-ink); box-shadow: inset 0 -2px 0 var(--sleeper-ink); }
.seg.methods [data-flowmethod="espn"][aria-pressed="true"] { background: var(--espn-tint); color: var(--espn-ink); box-shadow: inset 0 -2px 0 var(--espn-ink); }
/* a quieter, smaller switch for a choice inside a method (ESPN: public league or paste) */
.seg.quiet { border-radius: 7px; background: var(--surface-2); padding: 2px; border-color: transparent; gap: 2px; }
.seg.quiet button { padding: 3px 10px; font-size: 13px; border-radius: 5px; color: var(--muted); }
.seg.quiet button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.flow-back { align-self: center; }
.flow-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.flow-title { display: flex; align-items: center; gap: 10px; }
.flow-title .wl-ico { width: 34px; height: 34px; border-radius: 8px; background: var(--wl-tint); color: var(--wl-ink); }
.flow-title .wl-ico svg { width: 20px; height: 20px; }
.flow-title.m-sleeper { --wl-tint: var(--sleeper-tint); --wl-ink: var(--sleeper-ink); }
.flow-title.m-espn { --wl-tint: var(--espn-tint); --wl-ink: var(--espn-ink); }
.flow-title.m-manual { --wl-tint: color-mix(in srgb, var(--accent) 14%, var(--surface)); --wl-ink: var(--accent); }

/* Fantasy team headers */
.teambar { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.tteams { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.tteam { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 128px; max-width: 260px; padding: 8px 14px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; text-align: left; }
.tteam:hover { border-color: var(--accent); }
.tteam .tn { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.15; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tteam .tm { font-size: 13px; color: var(--muted); white-space: normal; line-height: 1.4; }
.tteam .tb { white-space: nowrap; }
.tteam .tm .num { color: var(--ink); }
.tteam[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); box-shadow: inset 0 0 0 .8px var(--accent); }
.tteam.add { min-width: 0; justify-content: center; align-items: center; border-style: dashed; color: var(--accent); font-weight: 600; }
.tmanage { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tmanage .inp { flex: 0 1 220px; }
.io .iochecks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
.io .iochecks label { display: inline-flex; align-items: center; gap: 6px; }
.io .iocode { min-height: 70px; font-size: 12px; word-break: break-all; }
.io input[type=checkbox] { accent-color: var(--accent); }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.btn:disabled { opacity: .5; cursor: default; }

/* Lineup rows */
.list { display: flex; flex-direction: column; }
.list .item + .item { border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 54px minmax(0, 1.5fr) minmax(0, 1.25fr) 62px 64px 92px 64px; align-items: center; gap: 12px; padding: 10px 14px; width: 100%; background: none; border: 0; text-align: left; }
.prow:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.lfix { padding: 0 14px 8px 80px; }
@media (max-width: 700px) { .lfix { padding-left: 14px; } }
.lhead { padding-block: 8px; }
.lhead:hover { background: none; }
.slot { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .04em; color: var(--accent); }
.slot.bench { color: var(--muted); }
.pname { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.psub { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
/* PlayerIdentity: the player's picture to the left of his name and position. Fixed sizes, so nothing shifts as images load. */
.pid { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pid-txt { display: flex; flex-direction: column; min-width: 0; }
.pimg { --pimg: 44px; flex: none; width: var(--pimg); height: var(--pimg); border-radius: 50%; overflow: hidden; background: var(--surface-2); color: color-mix(in srgb, var(--muted) 45%, var(--surface-2)); display: grid; place-items: end center; }
.pimg img { width: 100%; height: 100%; object-fit: cover; }
.pimg svg { width: 84%; height: 84%; }
.pimg.logo, .pimg.team { place-items: center; }
.pimg.logo img { width: 76%; height: 76%; object-fit: contain; }
.pimg-t { font-family: var(--font-display); font-weight: 700; font-size: calc(var(--pimg) * .32); letter-spacing: .02em; color: var(--muted); }
.pid.sm .pimg { --pimg: 34px; }
.pid.lg { gap: 12px; }
.pid.lg .pimg { --pimg: 56px; }
.pid.lg .pname { font-size: 18px; }
.match { font-size: 13px; min-width: 0; }
.match .opp { font-weight: 600; }
.proj { font-size: 24px; text-align: right; line-height: 1; }
.range { font-size: 13px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.pav { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
.prow > .grade { justify-self: center; }
.grade { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 18px; border: 1px solid var(--line); }
.g-A { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.g-B { background: color-mix(in srgb, var(--good) 10%, transparent); color: var(--good); }
.g-C { color: var(--muted); }
.g-D { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
.g-F { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
.pill { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; line-height: 1.4; white-space: nowrap; }
.pill.q { color: var(--warn); }
.pill.o { color: var(--bad); }
.pill.n { color: var(--accent); }
.pill.m { color: var(--muted); }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.chip.up { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.chip.down { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }

/* Detail */
.detail { padding: 4px 14px 16px 80px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
.factors { display: flex; flex-direction: column; gap: 9px; }
.factor { display: grid; grid-template-columns: minmax(0, 1fr) 120px 48px; gap: 10px; align-items: center; }
.factor .fl { font-weight: 600; font-size: 13.5px; }
.factor .fn { font-size: 13px; color: var(--muted); }
.fbar { position: relative; height: 10px; background: var(--surface-2); border-radius: 3px; }
.fbar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.fbar span { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.fbar .pos { left: 50%; background: var(--good); }
.fbar .neg { right: 50%; background: var(--bad); }
.fv { text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; }
.scheme { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.probs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.probs > div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.probs .num { font-size: 22px; line-height: 1; }
.math { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dh { font-size: 16px; }
.reasons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; }
.reasons li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.reasons .rv { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.reasons li.up .rv { color: var(--good); } .reasons li.down .rv { color: var(--bad); }
.detail details.more { grid-column: 1 / -1; }
details.more { border-top: 1px solid var(--line); padding-top: 8px; }
details.more > summary, details.model > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--accent); }
details.more[open] > summary { margin-bottom: 8px; }
details.model p { margin: 6px 0 0; max-width: 72ch; }
.pick-note { font-size: 14px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.ovr { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.ovr input { width: 84px; }

/* Tables */
.tscroll { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--surface); position: sticky; top: 0; }
th[data-sort] { cursor: pointer; }
th[data-sort]:hover { color: var(--ink); }
td:first-child, th:first-child, td.l, th.l { text-align: left; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.spark { display: inline-block; vertical-align: middle; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.spark .area { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: none; }
.spark circle { fill: var(--accent); }
.trend-up { color: var(--good); }
.trend-down { color: var(--bad); }

/* Compare */
.cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cmp .card { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
/* Waiver Optimizer headline */
@keyframes opened { from { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent); } to { box-shadow: 0 0 0 3px transparent; } }
.opened { animation: opened 1.2s ease-out; }
.setup { gap: 14px; border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); }
.setup-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 20px; }
.setup .opt { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

/* ---------- Sleeper league sync ----------

/* ---------- rendering ---------- */
/* Start/sit calls worth a second look: a starter whose best eligible bench player has at least a 38% chance of
   outscoring him, or a starter tagged questionable or doubtful. Closest calls first. */
const shortName = id => { const u = D.U.get(id); return !u ? '' : u.pos === 'DEF' ? (TEAMS[u.team]?.[1] || u.team) : u.name.split(' ').slice(-1)[0]; };
const pBeats = (a, b) => (a.sd || b.sd) ? Phi((a.mean - b.mean) / Math.sqrt(a.sd ** 2 + b.sd ** 2)) : (a.mean >= b.mean ? 1 : 0);
function reviewDecisions() {
  if (!state.roster.length || !D.M) return [];
  const { starters, bench } = optimize(), out = [];
  const alts = bench.filter(r => r.status === 'ok' && !r.locked);
  for (const s of starters) {
    const st = s.r; if (!st || st.locked) continue;
    const alt = alts.filter(b => s.slot.elig.includes(b.pos)).sort((x, y) => y.mean - x.mean)[0];
    const tagged = /^(questionable|doubtful)/i.test(st.inj || '');
    if (!alt) continue;
    const p = pBeats(alt, st);
    if (p >= 0.38 || tagged) out.push({ start: st.id, alt: alt.id, slot: s.slot.label || s.slot.k, p, tagged });
  }
  const seen = new Set();
  return out.filter(d => !seen.has(d.alt) && seen.add(d.alt)).sort((a, b) => b.p - a.p);
}
/* ---------- Team Grade ----------
   Each starter is ranked against every player at his position on season-long value (rosBase, so one matchup doesn't
   swing it), the same ranking Waivers uses for team needs. A starter who ranks like an elite starter in a league this
   size scores 100, a league-average starter about 70, and it drops from there. Kickers and defenses count less, good
   bench depth at RB/WR/TE adds a little, and the total is out of 100 with a letter grade. */
const GRADE_CUTS = [[93, 'A+'], [87, 'A'], [83, 'A−'], [79, 'B+'], [75, 'B'], [71, 'B−'], [67, 'C+'], [63, 'C'], [59, 'C−'], [55, 'D+'], [50, 'D'], [0, 'F']];
const POS_WEIGHT = { QB: 1, RB: 1, WR: 1, TE: 0.8, K: 0.3, DEF: 0.4 };
function teamGrade() {
  if (!state.roster.length || !D.M) return null;
  const { needs } = computeWaivers(), L = state.waivers.teams || 12, per = {};
  let sum = 0, wsum = 0, depth = 0;
  for (const n of needs.list) {
    const need = Math.max(1, Math.round(posSlots(n.P))), share = posSlots(n.P) / need, w = POS_WEIGHT[n.P] ?? 1, scores = [];
    for (let i = 0; i < need; i++) {
      const r = n.rows[i], avgRank = L * (i + 0.5) * share, ratio = r && r.rank && !r.away ? r.rank / avgRank : 4;
      scores.push(ratio <= 1 ? 100 - 30 * Math.max(0, ratio - 0.3) / 0.7 : Math.max(15, 70 - 30 * (ratio - 1)));
    }
    const s = mean(scores); per[n.P] = Math.round(s); sum += s * w * need; wsum += w * need;
    // a bench player who'd start for many teams is real injury cover
    if (['RB', 'WR', 'TE'].includes(n.P)) for (const r of n.rows.slice(need)) if (r.rank && r.rank <= L * (need + 1) * share) depth++;
  }
  if (!wsum) return null;
  const score = clamp(Math.round(sum / wsum + Math.min(4, depth)), 0, 100), letter = GRADE_CUTS.find(([c]) => score >= c)[1];
  const main = Object.entries(per).filter(([P]) => P !== 'K' && P !== 'DEF').sort((a, b) => b[1] - a[1]);
  return { score, letter, per, best: main[0]?.[0], worst: main.length > 1 ? main[main.length - 1][0] : null };
}
const gradeClass = l => l[0] === 'A' ? 'A' : l[0] === 'B' ? 'B' : l[0] === 'C' ? 'C' : l[0] === 'D' ? 'D' : 'F';
const posLabel = P => P === 'DEF' ? 'D/ST' : P;
function gradeCard() {
  const g = teamGrade(); if (!g) return '';
  return `<div class="card grade-card"><span class="gc-letter g-${gradeClass(g.letter)}" aria-hidden="true">${g.letter}</span>
    <div class="gc-main"><span class="label">Benny Grade</span><div><span class="num gc-score">${g.score}</span><span class="muted">/100</span> <span class="vh">${g.letter}</span></div>
      <div class="small muted">${g.best ? `Strongest: <strong>${posLabel(g.best)}</strong>` : ''}${g.worst && g.worst !== g.best ? ` · Weakest: <strong>${posLabel(g.worst)}</strong>` : ''}</div></div>
    <div class="gc-pos">${Object.entries(g.per).map(([P, s]) => `<span class="chip ${s >= 80 ? 'up' : s < 55 ? 'down' : ''}" title="${posLabel(P)} starters score ${s}/100">${posLabel(P)} ${s}</span>`).join('')}</div></div>`;
}
/* Your weakest spot: the QB, RB, WR or TE group with the lowest Benny Grade score, and the free agents there most worth
   adding. Candidates come from the Waivers pool (players available in most leagues, or your league's own free agents),
   best usual week first, each against the weakest starter you have there. Marking one Taken skips him and the next
   moves up. */
function weakSpot(n = 5) {
  const g = teamGrade(); if (!g?.worst) return null;
  const R = computeWaivers(), P = g.worst, vs = id => R.VS[id]?.[0] ?? 0;
  const st = (R.needs.list.find(x => x.P === P)?.rows || []).filter(r => r.starter).map(r => r.id);
  const mine = st.length ? st.reduce((a, b) => vs(b) < vs(a) ? b : a) : null;
  const picks = R.pool.filter(id => D.U.get(id).pos === P).sort((a, b) => vs(b) - vs(a)).slice(0, n)
    .map(id => ({ id, val: vs(id), gain: vs(id) - (mine ? vs(mine) : 0) }));

// how likely a free agent is to be on your league's waiver wire, from the same source the Waivers pool uses
function availTxt(id) {
  const W = state.waivers;
  if (W.source === 'sleeper' && state.sleeper?.rostered) return 'free agent in your league';
  if (W.source === 'list' && W.faList.length) return 'on your league’s free-agent list';
  if (!D.own.size) return '';
  const o = D.own.get(id) ?? 0; return `available in ${o < 1 ? '99%+' : Math.round(100 - o) + '%'} of leagues`;
}

/* ---------- Benny's Moves ----------
   The most useful things to do with this team now, from the engines the other pages use: lineup changes against the
   lineup set in Sleeper or ESPN (or this week's closest calls when Benny doesn't know it), injured starters to bench,
   the best waiver moves, and the weakest position. Ranked by points gained; position advice comes last. Free shows
   the top two. */
function bennysMoves() {
  if (!state.roster.length || !D.M) return [];
  const out = [], { starters } = optimize(), on = new Set(starters.filter(s => s.r).map(s => s.r.id)), nm = id => esc(D.U.get(id)?.name || '');
  let app = null, appName = '';
  if (state.sleeper?.starters) { app = new Set(state.sleeper.starters); appName = 'Sleeper'; }
  else if (Object.keys(state.espn.slotOf || {}).length) { app = new Set(Object.entries(state.espn.slotOf).filter(([, s]) => !(s === 20 || s === 21)).map(([id]) => id)); appName = 'ESPN'; }
  if (app) {
    const ins = starters.filter(s => s.r && !s.r.locked && !app.has(s.r.id)).map(s => s.r);
    const outs = state.roster.filter(id => app.has(id) && !on.has(id)).map(id => D.M[id]).filter(r => r && !r.locked);
    const flex = p => ['RB', 'WR', 'TE'].includes(p);
    for (const r of ins.sort((a, b) => b.mean - a.mean)) {
      let i = outs.findIndex(o => o.pos === r.pos); if (i < 0) i = outs.findIndex(o => flex(o.pos) && flex(r.pos)); if (i < 0) continue;
      const o = outs.splice(i, 1)[0], gone = o.status !== 'ok', gain = r.mean - (gone ? 0 : o.mean);
      out.push({ gain, tab: 'lineup', title: gone ? `Bench ${nm(o.id)} (${esc(o.status === 'bye' ? 'bye week' : o.inj || 'out')}), start ${nm(r.id)}` : `Start ${nm(r.id)} over ${nm(o.id)}`,
        detail: gone ? `${nm(o.id)} won’t play this week but is in your ${appName} lineup.` : `Your ${appName} lineup starts ${nm(o.id)}; Benny projects ${nm(r.id)} for ${f1(r.mean)} vs ${f1(o.mean)}.`, gainTxt: `+${f1(gain)} pts` });
    }
    for (const o of outs) if (o.status !== 'ok') out.push({ gain: o.status === 'bye' ? 3 : 5, tab: 'lineup', title: `Bench ${nm(o.id)}`, detail: `${o.status === 'bye' ? 'On bye' : esc(o.inj || 'Ruled out')} but in your ${appName} lineup.`, gainTxt: '' });
  } else {
    for (const d of reviewDecisions().slice(0, 3)) {
      const s = D.M[d.start], b = D.M[d.alt];
      out.push({ gain: Math.max(0.1, s.mean - b.mean), tab: 'compare', decide: `${d.start}|${d.alt}`, title: `Start ${nm(s.id)} over ${nm(b.id)} at ${esc(d.slot)}`,
        detail: `A close call: Benny leans ${nm(s.id)} by ${f1(Math.max(0, s.mean - b.mean))} pts${d.tagged ? `, but he’s ${esc((s.inj || '').toLowerCase())}, so check news before kickoff` : ''}.`, gainTxt: `+${f1(s.mean - b.mean)} pts` });
    }
  }
  const W = computeWaivers(), usedPos = new Set(), usedDrop = new Set(), picks = [];
  // one move per position added and per player dropped, compared per week so a 4-week gain doesn't outrank this week's lineup
  for (const m of W.moves) { if (m.marginal) continue; const p = D.U.get(m.f).pos; if (usedPos.has(p) || (m.d && usedDrop.has(m.d))) continue; usedPos.add(p); if (m.d) usedDrop.add(m.d); picks.push(m); if (picks.length === 3) break; }
  for (const m of picks) out.push({ gain: m.score / m.H, tab: 'waivers', title: `Add ${nm(m.f)}${m.d ? `, drop ${nm(m.d)}` : ''}`, detail: esc(m.whyText || '') + '.', gainTxt: `+${f1(m.hz)} pts over ${m.H} wk${m.H > 1 ? 's' : ''}` });
  out.sort((a, b) => b.gain - a.gain);
  /* Your weakest position by Benny Grade, with the best free agent there by name. It goes second, so a free account
     (top two) always sees it; a waiver move above that already adds the player isn't repeated. */
  const ws = weakSpot(), added = new Set(picks.map(m => m.f)), pk = ws?.picks.find(p => !added.has(p.id));
  if (ws) {
    const P = posLabel(ws.P), vs = ws.mine ? ` vs ${nm(ws.mine)}’s ${f1(ws.mineVal)}` : '', av = pk ? availTxt(pk.id) : '';
    out.splice(Math.min(1, out.length), 0, pk
      ? { gain: 0, tab: 'waivers', taken: pk.id, title: `Upgrade ${P}, your weakest spot: add ${nm(pk.id)}`,
          detail: `Your ${P}s score ${ws.score}/100 on Benny Grade. ${nm(pk.id)} projects ${f1(pk.val)} pts a usual week${vs}${pk.gain > 0.5 ? '' : ', the best free agent there but not an upgrade yet'}${av ? `; ${av}` : ''}.`,
          gainTxt: pk.gain > 0.5 ? `+${f1(pk.gain)} pts/wk` : '' }
      : { gain: 0, tab: 'waivers', title: `Upgrade ${P}: your weakest spot`, detail: `Your ${P}s score ${ws.score}/100 on Benny Grade and no free agent there is left. Target one by trade.`, gainTxt: '' });
  }

}
function movesCard() {

    <div class="mv-side">${m.gainTxt ? `<span class="mv-gain num">${m.gainTxt}</span>` : ''}${m.taken ? `<button type="button" class="btn sm" data-taken="${esc(m.taken)}" title="Already on a team in your league: skip to the next one">Taken? Skip</button>` : ''}<button type="button" class="btn sm" ${m.decide ? `data-decide="${esc(m.decide)}"` : `data-tab="${m.tab}"`}>${m.decide ? 'Compare' : m.tab === 'waivers' ? 'Waivers' : 'Lineup'}</button></div></li>`;

function spark(vals, fmt) {
  const pts = vals.map((v, i) => [i, v]).filter(p => ok(p[1])); if (pts.length < 2) return '<span class="muted small">—</span>';

  const line = pts.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(' '), last = pts[pts.length - 1];
  const area = `${x(pts[0][0]).toFixed(1)},${H - P} ${line} ${x(last[0]).toFixed(1)},${H - P}`;
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(vals.map(fmt).join(', '))}"><polygon class="area" points="${area}"/><polyline points="${line}"/><circle cx="${x(last[0]).toFixed(1)}" cy="${y(last[1]).toFixed(1)}" r="2.6"/></svg>`;
}

  <div class="card panel"><details class="how"><summary>How the projection works</summary>
    <ol><li><strong>Base:</strong> Sleeper’s weekly projection, converted to each team’s scoring (PPR, half-PPR or standard), blended with the player’s season average (slider above). A healthy player Sleeper doesn’t project while it projects a teammate at his position is a backup, with a base of 0 however he scored filling in. When the projection is under half or over 1.6× his average, his role changed and the projection leads (90%).</li>
    <li><strong>Matchup factors</strong>, each capped at ±25%: fantasy points the opponent allows to the position; secondary (pass yards allowed) or run defense (yards per carry allowed, plus the player’s own line); sacks allowed by the offense vs. sacks by the opposing defense; the team’s Vegas implied total and spread, with the opponent’s record; the offense’s pass rate and pace; and the opponent’s defensive roster changes (signings, trades, injuries) that its stats don’t show yet. Together they’re capped at ±20%, and they move only the season-average part of the base, since Sleeper’s projection already counts the matchup.</li>

  </div>`;
}

/* Matches pasted text (ESPN's roster table, or one name per line) against every player with a projection or a game played.

function matchPasted(text) {
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const live = [...D.U.values()].filter(u => (D.proj[u.id]?.pts || 0) > 0 || D.H[u.id] || D.prevPPG?.[u.id]);
  const names = live.map(u => [norm(u.name), u]).filter(([n]) => n.includes(' ') && n.length >= 6).sort((a, b) => b[0].length - a[0].length || (D.M[b[1].id]?.mean || 0) - (D.M[a[1].id]?.mean || 0));
  const ids = [], miss = [];
  for (const l of lines) {
    const k = norm(l); if (k.length < 4 || /^\d/.test(k)) continue;
    let u = (D.nameIdx.get(k) || []).map(id => D.U.get(id)).sort((a, b) => (D.M[b.id]?.mean || 0) - (D.M[a.id]?.mean || 0))[0];
    if (!u) { const T = teamOf(k); if (T) u = D.U.get(T); }   // a line naming a team ("Pittsburgh Steelers", "PIT D/ST") is its D/ST
    if (!u) u = names.find(([n]) => k.includes(n))?.[1];
    if (!u && /d\/?st|defense|\bdef\b/.test(k)) { const T = ABBR.find(a => k.includes(TEAMS[a][1].toLowerCase())); if (T) u = D.U.get(T); }
    if (u) { if (!ids.includes(u.id)) ids.push(u.id); } else if (/[a-z]{2,} [a-z]{2,}/.test(k) && k.length < 40) miss.push(l);

}

  render();
}
