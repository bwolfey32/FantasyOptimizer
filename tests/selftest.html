<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benny's Picks self-test</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  pre { white-space: pre-wrap; }
  iframe { width: 1200px; height: 900px; border: 1px solid #ccc; }
</style>
</head>
<body>
<h1>Benny's Picks self-test</h1>
<p>Loads the site on a frozen data bundle (week 4 of 2026, taken mid-games) and checks the model's rules. Run it with
<code>scripts/selftest.ps1</code>, or serve the repo folder and open this page. Results land in the block below; any line
starting with FAIL fails the run.</p>
<pre id="selftest-out">running…</pre>
<iframe id="app" src="../index.html?fixture=tests/fixture-2026w4.json#selftest" title="App under test"></iframe>
<script>
const out = [], frame = document.getElementById('app');
let W;
const ev = s => W.eval(s);                       // the app's top-level let/const aren't on window, so reach them by eval
const pass = name => out.push('PASS ' + name);
const fail = (name, why) => out.push('FAIL ' + name + (why ? ': ' + why : ''));
function check(name, fn) {
  try { const r = fn(); if (r === true || r === undefined) pass(name); else fail(name, r === false ? '' : String(r)); }
  catch (e) { fail(name, 'threw ' + (e && e.stack || e)); }
}
const near = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol;

// The reviewer's roster (Oct 4, 2026): 12 teams, PPR, 1 QB / 2 RB / 2 WR / 1 TE / 1 FLEX / D/ST / K, 4-week window.
const ROSTER = ['Baker Mayfield', 'Jared Goff', 'Jahmyr Gibbs', 'James Cook', 'Tony Pollard', 'Zach Charbonnet', 'Bhayshul Tuten',
  'Tee Higgins', 'Jaylen Waddle', 'Khalil Shakir', 'Jakobi Meyers', 'Josh Downs', 'Rashid Shaheed', 'Dalton Kincaid', 'Hunter Henry',
  'Brandon Aubrey', 'PIT'];
function idOf(name) {
  const D = ev('D');
  if (D.U.has(name)) return name;
  const ids = D.nameIdx.get(ev('norm')(name)) || [];
  return ids.sort((a, b) => (D.M[b]?.mean || 0) - (D.M[a]?.mean || 0))[0] || null;
}
/* Reset to the reviewer's setup: default slots, PPR, no TE premium, default waivers. Each test starts here. */
function setup(extra) {
  const st = ev('state'), DEF = ev('DEFAULT_STATE'), D = ev('D');
  st.roster = ROSTER.map(idOf);
  st.slots = Object.assign({}, DEF.slots);
  st.scoring = 'ppr'; st.tePrem = 0; st.sleeper = null; st.overrides = {}; st.returnWeek = {}; st.liveFix = {};
  st.espn = Object.assign({}, DEF.espn);
  st.waivers = JSON.parse(JSON.stringify(DEF.waivers));
  st.settings = Object.assign({}, DEF.settings, { w: Object.assign({}, DEF.settings.w) });
  if (extra) extra(st, D);
  D.wCache = null; D.hist = {};
  ev('syncScoring')(); ev('computeAll')();
}
const M = id => ev('D').M[id];
const name = id => ev('D').U.get(id)?.name || id;

const TESTS = [];
const test = (name, fn) => TESTS.push([name, fn]);

/* ---------- Phase 0: the harness itself ---------- */
test('fixture loaded (week 4, 2026)', () => { const D = ev('D'); return D.season === 2026 && D.week === 4 && D.U.size > 300 || `season ${D.season} week ${D.week}, ${D.U.size} players`; });
test('reviewer roster resolves to 17 players', () => { setup(); const r = ev('state').roster; return r.every(Boolean) && r.length === 17 || 'missing: ' + ROSTER.filter((n, i) => !r[i]).join(', '); });
test('lineup fills every slot, keeping the pregame lineup once games start', () => {
  setup(); const D = ev('D'), L = Object.values(D.M).filter(r => r.locked);
  // Benny's lineup as shown before kickoff, saved in the history as a visit before the games would have
  L.forEach(r => { r.locked = false; }); const pre = ev('optimize')().starters; L.forEach(r => { r.locked = true; });
  D.hist[ev('liveKey')()] = { starters: pre.map(s => [s.slot.k, s.r?.id || null, '', '', 0]) };
  const now = ev('optimize')().starters, moved = pre.filter((s, i) => s.r?.locked && !now.some(x => x.r?.id === s.r.id));
  return now.every(s => s.r) && !moved.length || `empty: ${now.filter(s => !s.r).map(s => s.slot.k)}, started players moved out: ${moved.map(s => name(s.r.id))}`;
});

/* ---------- Phase 1: player roles and injury timelines ---------- */
test('backup QB (Drew Lock) is a backup worth 0 this week', () => {
  setup(); const r = M(idOf('Drew Lock'));
  return r.role?.kind === 'backup' && r.mean === 0 && name(r.role.behind) === 'Sam Darnold' || `role ${JSON.stringify(r.role)}, mean ${r.mean}`;
});
test('backups are not waiver pickups', () => { setup(); return !ev('availablePool')().includes(idOf('Drew Lock')); });
test('no waiver move adds a backup', () => {
  setup(); const W = ev('computeWaivers')();
  const bad = W.moves.filter(m => M(m.f)?.role?.kind === 'backup');
  return !bad.length || 'adds ' + bad.map(m => name(m.f)).join(', ');
});
test('a starter keeps his usual blend (no role flag)', () => { setup(); const r = M(idOf('Jared Goff')); return !r.role || JSON.stringify(r.role); });
test('return weeks do not move with the week viewed', () => {
  setup(); const D = ev('D'), rw = ev('returnWeek'), ids = [idOf('Baker Mayfield'), idOf('Zach Charbonnet')];
  const at = w => { const keep = D.week; D.week = w; try { return ids.map(rw); } finally { D.week = keep; } };
  const a = at(4), b = at(6), c = at(4);
  return JSON.stringify(a) === JSON.stringify(b) && JSON.stringify(a) === JSON.stringify(c) || `wk4 ${a}, wk6 ${b}, back to wk4 ${c}`;
});
test('return week counts from when he was first listed', () => {
  setup(); const D = ev('D'), id = idOf('Baker Mayfield'), keep = D.injLog[id];
  try {
    D.injLog[id] = ['Out', 2026, 4, '2026-09-28']; const a = ev('returnWeek')(id);   // listed this week: back next week
    D.injLog[id] = ['Out', 2026, 2, '2026-09-14']; const b = ev('returnWeek')(id);   // still listed two weeks on: next week at the earliest
    return a === 5 && b === 5 || `first listed wk 4 → ${a}, wk 2 → ${b}`;
  } finally { D.injLog[id] = keep; }
});
test('IR/PUP counts four team games, skipping a bye', () => {
  setup(); const D = ev('D'), id = idOf('Zach Charbonnet'), keep = D.injLog[id], T = D.U.get(id).team;
  try {
    D.injLog[id] = ['PUP', 2026, 4, '2026-09-28']; let w = 4, g = 0; while (g < 4) { if (!ev('schedOpp')(T, w).bye) g++; w++; }
    const got = ev('returnWeek')(id); return got === w || `expected ${w}, got ${got}`;
  } finally { D.injLog[id] = keep; }
});
test('your expected-back week only applies to its season', () => {
  setup(st => { st.returnWeek = { [idOf('Baker Mayfield')]: { w: 9, s: 2025 } }; });
  const a = ev('returnWeek')(idOf('Baker Mayfield'));
  setup(st => { st.returnWeek = { [idOf('Baker Mayfield')]: { w: 9, s: 2026 } }; });
  const b = ev('returnWeek')(idOf('Baker Mayfield'));
  return a !== 9 && b === 9 || `last season's override → ${a}, this season's → ${b}`;
});
test('a later week counts an injured player in once he is back', () => {
  setup(); const D = ev('D'), id = idOf('Baker Mayfield'), back = ev('returnWeek')(id), keep = D.week;
  try { D.week = back; const r = ev('evalPlayer')(id); D.week = back - 1; const r2 = ev('evalPlayer')(id); return r.status !== 'out' && r2.status === 'out' || `wk ${back}: ${r.status}, wk ${back - 1}: ${r2.status}`; }
  finally { D.week = keep; ev('computeAll')(); }
});

/* ---------- Phase 2: actionable live lineup (the fixture was saved with some week-4 games under way) ---------- */
const lockedOnRoster = () => ev('state').roster.filter(id => M(id)?.locked);
test('fixture has players whose games started', () => { setup(); return lockedOnRoster().length >= 3 || 'only ' + lockedOnRoster().length; });
test('the lineup score ignores points already scored', () => {
  setup(); const r = M(lockedOnRoster().find(id => ev('ok')(M(id).actual)));
  return r && ev('metricOf')(r) === r.mean || `metric ${r && ev('metricOf')(r)}, mean ${r?.mean}, actual ${r?.actual}`;
});
test('with no known lineup, Benny assumes his pregame lineup and fills every slot', () => {
  setup(); const D = ev('D'), L = Object.values(D.M).filter(r => r.locked);
  L.forEach(r => { r.locked = false; }); const pre = new Set(ev('optimize')().starters.filter(s => s.r).map(s => s.r.id)); L.forEach(r => { r.locked = true; });
  const now = ev('optimize')().starters, stray = now.filter(s => s.r?.locked && !pre.has(s.r.id));
  return ev('knownStarters')().src === 'guess' && now.every(s => s.r) && !stray.length || `src ${ev('knownStarters')().src}, empty ${now.filter(s => !s.r).length}, stray ${stray.map(s => name(s.r.id))}`;
});
test('waivers don\'t count slots already filled by started players as open', () => {
  setup(); const W = ev('computeWaivers')(), wk = W.moves.map(m => m.hz).filter(x => x > 12);
  return !wk.length || 'moves gaining over 12 points: ' + W.moves.filter(m => m.hz > 12).map(m => `${name(m.f)} +${m.hz.toFixed(1)}`).join(', ');
});
test('players you started keep their slots; others already playing stay benched', () => {
  setup(); const L = lockedOnRoster(), mine = L.slice(0, 2), D = ev('D');
  D.hist[ev('liveKey')()] = { starters: mine.map(id => ['X', id, '', '', 0]) };
  const { starters, bench } = ev('optimize')(), on = new Set(starters.filter(s => s.r).map(s => s.r.id));
  const lost = mine.filter(id => !on.has(id)), promoted = L.filter(id => !mine.includes(id) && on.has(id));
  return !lost.length && !promoted.length || `lost ${lost.map(name)}, promoted ${promoted.map(name)}`;
});
test('"I started him" / "I didn\'t start him" move a player already playing in and out', () => {
  setup(); const L = lockedOnRoster(), inLineup = id => ev('optimize')().starters.some(s => s.r?.id === id);
  const benched = L.find(id => !inLineup(id)), started = L.find(inLineup);
  if (!benched || !started) return 'fixture needs a started and a benched player already playing';
  ev('toggleStarted')(benched); ev('toggleStarted')(started);
  const a = inLineup(benched), b = inLineup(started);
  return a && !b || `${name(benched)} in lineup: ${a}; ${name(started)} in lineup: ${b}`;
});
test('Lineup and Start/Sit agree: no benched player projects more than the starter in a slot he fits', () => {
  setup(); const { starters, bench } = ev('optimize')(), bad = [];
  for (const s of starters) { if (!s.r || s.r.locked) continue;
    for (const b of bench) if (b.status === 'ok' && !b.locked && s.slot.elig.includes(b.pos) && b.mean > s.r.mean + 1e-9) bad.push(`${name(b.id)} ${b.mean.toFixed(1)} over ${name(s.r.id)} ${s.r.mean.toFixed(1)}`); }
  return !bad.length || bad.join('; ');
});

/* ---------- Phase 3: waiver decision quality ---------- */
const single = id => ['K', 'DEF'].includes(ev('D').U.get(id)?.pos);
for (const longTerm of [false, true]) {
  const how = longTerm ? ' (+ long-term value)' : '';
  const run = () => { setup(st => { st.waivers.rank = longTerm ? 'blend' : 'window'; }); return ev('computeWaivers')(); };
  test('no move drops another position to carry a second kicker or D/ST' + how, () => {
    const bad = run().moves.filter(m => single(m.f) && m.d && ev('D').U.get(m.d).pos !== ev('D').U.get(m.f).pos);
    return !bad.length || bad.map(m => `${name(m.f)} for ${name(m.d)}`).join(', ');
  });
  test('the best move clears the hold bar' + how, () => {
    const W = run(), b = W.best; if (!b) return true;
    const bar = Math.max(1.5, 0.75 * W.H), swap = single(b.f) && b.d && single(b.d);
    return !b.marginal && (b.longBet || (swap ? b.hz / W.H >= 1 : Math.max(b.hz, b.strength * W.H) >= bar)) || `${name(b.f)}: +${b.hz.toFixed(1)}`;
  });
}
test('Shrader for Shakir is never suggested; Aubrey to Shrader is at most marginal', () => {
  setup(st => { st.waivers.rank = 'blend'; }); const W = ev('computeWaivers')(), S = idOf('Spencer Shrader');
  const forShakir = W.moves.find(m => m.f === S && m.d === idOf('Khalil Shakir')), swap = W.moves.find(m => m.f === S && m.d === idOf('Brandon Aubrey'));
  if (forShakir) return 'Shrader for Shakir is listed';
  return !swap || (swap.marginal && W.best !== swap) || `Aubrey to Shrader: +${swap.hz.toFixed(1)} over ${W.H} weeks, marginal ${swap.marginal}`;
});

/* ---------- every phase: the views still render ---------- */
test('Lineup, Start/Sit and Waivers render', () => {
  setup(); const lu = ev('viewLineup')(), cmp = ev('viewCompare')(), wv = ev('viewWaivers')();
  if (!/Scored so far/.test(lu)) return 'Lineup has no "Scored so far" tile during live games';
  if (/Optimizing for/.test(lu)) return 'Lineup still shows "Optimizing for" during live games';
  return cmp.length > 500 && wv.length > 500 || 'a view came back nearly empty';
});
test('Start/Sit makes no call for a player whose game started', () => {
  setup(); const L = lockedOnRoster(), free = ev('state').roster.find(id => M(id) && !M(id).locked && M(id).status === 'ok');
  ev('state').compare = [L[0], free]; const html = ev('viewCompare')(); ev('state').compare = [null, null];
  return /Game started/.test(html) && !/chance to outscore/.test(html) || 'verdict shown for a started player';
});

window.addEventListener('load', () => {
  const t0 = Date.now();
  (function wait() {
    W = frame.contentWindow;
    if (!W || !W.__ready) { if (Date.now() - t0 > 60000) { document.getElementById('selftest-out').textContent = 'FAIL app never became ready'; return; } return setTimeout(wait, 100); }
    for (const [n, fn] of TESTS) check(n, fn);
    const nFail = out.filter(l => l.startsWith('FAIL')).length;
    out.push(`DONE ${TESTS.length - nFail} passed, ${nFail} failed`);
    document.getElementById('selftest-out').textContent = out.join('\n');
  })();
});
</script>
</body>
</html>
