<style>

tr.pool td { font-weight: 600; background: color-mix(in srgb, var(--accent) 7%, transparent); }

.scroll { overflow-x: auto; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }

svg { display: block; width: 100%; overflow: visible; }

svg text.ink { fill: var(--ink); }
svg text.lab { font-size: 12px; }

.tip b { font-weight: 600; font-size: 14px; }
.tip .r { display: flex; gap: 8px; align-items: baseline; }
.tip .r .key { width: 10px; }
.tip .m { color: var(--muted); }
details { margin: 8px 0 0; }
summary { cursor: pointer; font-size: 13px; color: var(--muted); }
input[type=search] { font: inherit; font-size: 14px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); width: 180px; }

.pos { font-size: 11px; font-weight: 600; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); margin-right: 5px; }
.err { padding: 24px; text-align: center; color: var(--muted); }
