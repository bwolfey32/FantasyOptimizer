# Runs tests/selftest.html (the model's rules, checked on a frozen week of data) in headless Chrome on every push and PR.
name: Self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run the self-test page
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --user-data-dir="$RUNNER_TEMP/chrome" \
            --virtual-time-budget=120000 --dump-dom "http://127.0.0.1:8000/tests/selftest.html" > "$RUNNER_TEMP/dom.html"
          python3 - "$RUNNER_TEMP/dom.html" <<'EOF'
          import html, re, sys
          dom = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          m = re.search(r'<pre id="selftest-out">(.*?)</pre>', dom, re.S)
          text = html.unescape(m.group(1)) if m else "FAIL no results in the page"
          print(text)
          sys.exit(1 if re.search(r"(?m)^FAIL", text) or not re.search(r"(?m)^DONE", text) else 0)
          EOF

      # whole drafted leagues through every engine, flagging advice that reads as wrong on sight (tests/audit.html):
      # the frozen week fails the run on any ERROR; the current snapshot is reported only, since its data changes
      - name: Audit the advice on the frozen week
        run: python3 scripts/audit.py --fixture tests/fixture-2026w4.json --leagues 3 --summary "$GITHUB_STEP_SUMMARY"

      - name: Audit the advice on the current snapshot
        run: python3 scripts/audit.py --fixture snapshot.json --leagues 3 --summary "$GITHUB_STEP_SUMMARY" --report-only

      # the weekly pages build from the frozen week (written to a scratch folder: the real ones come from the data refresh)
      - name: Build the weekly pages from the frozen week
        run: python3 scripts/weekly_pages.py --fixture tests/fixture-2026w4.json --out "$RUNNER_TEMP/pages"

      - name: Check the data scripts
        run: |
          python3 -m py_compile scripts/extract_snapshot.py scripts/calibrate.py scripts/player_ids.py scripts/audit.py scripts/weekly_pages.py scripts/model/*.py
          node --check sw.js
          python3 scripts/calibrate.py --selfcheck
