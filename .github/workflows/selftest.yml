# Runs tests/selftest.html (the model's rules, checked on a frozen week of data) in headless Chrome on every push and PR.
name: Self-test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run the self-test page
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --user-data-dir="$RUNNER_TEMP/chrome" \
            --virtual-time-budget=120000 --dump-dom "http://127.0.0.1:8000/tests/selftest.html" > "$RUNNER_TEMP/dom.html"
          python3 - "$RUNNER_TEMP/dom.html" <<'EOF'
          import html, re, sys
          dom = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          m = re.search(r'<pre id="selftest-out">(.*?)</pre>', dom, re.S)
          text = html.unescape(m.group(1)) if m else "FAIL no results in the page"
          print(text)
          sys.exit(1 if re.search(r"(?m)^FAIL", text) or not re.search(r"(?m)^DONE", text) else 0)
          EOF
