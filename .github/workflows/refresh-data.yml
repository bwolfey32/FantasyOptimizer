# Refreshes snapshot.json, the saved copy of the data that the site shows instantly while live data loads
# (and keeps showing if Sleeper or ESPN can't be reached). Runs every 3 hours, or on demand from the Actions tab.
name: Refresh data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # served over http, not file://, because ESPN's ownership feed rejects requests from file pages
      - name: Render the page in export mode
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --user-data-dir="$RUNNER_TEMP/chrome" \
            --virtual-time-budget=240000 --dump-dom "http://127.0.0.1:8000/index.html#export" > "$RUNNER_TEMP/dom.html"

      - name: Save snapshot.json
        run: python3 scripts/extract_snapshot.py "$RUNNER_TEMP/dom.html" snapshot.json

      # the trained model's projections (model/proj.json) from the new snapshot, nflverse's box scores and depth charts,
      # and the classic numbers the export wrote (model/classic.json); a failure keeps the last file, and the page falls
      # back to the classic model whenever the file isn't for the current week
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/model/requirements.txt
      - name: Restore downloaded NFL data
        uses: actions/cache@v4
        with:
          path: scripts/backtest/cache/nflverse
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      - name: Trained projections
        run: |
          pip install -q -r scripts/model/requirements.txt
          python3 scripts/model/predict.py || echo "Trained projections kept from the last run"

      # checks the frozen forecasts of finished weeks against what players scored; a failure here never blocks the snapshot
      - name: Check past forecasts against results
        run: python3 scripts/calibrate.py || echo "Calibration skipped this run"

      # the fresh data through whole drafted leagues: advice that reads as wrong on sight lands in this run's summary;
      # never blocks the snapshot
      - name: Audit the advice on the new data
        run: python3 scripts/audit.py --fixture snapshot.json --leagues 3 --summary "$GITHUB_STEP_SUMMARY" --report-only || echo "Audit skipped this run"

      # Sleeper and ESPN ids for player headshots, and share-players.json for share links' cards; rebuilt at most once a day, and a failure keeps the old map
      - name: Update player ids
        run: python3 scripts/player_ids.py player-ids.json || echo "Player ids kept from the last run"

      # the weekly pages search engines read (waiver wire, rankings, defenses, weather) and sitemap.xml, from the new
      # snapshot through the site's own model; a failure keeps last run's pages
      - name: Write the weekly pages
        run: python3 scripts/weekly_pages.py --fixture snapshot.json || echo "Weekly pages kept from the last run"

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          for p in snapshot.json forecasts calibration.json player-ids.json share-players.json weekly sitemap.xml model; do if [ -e "$p" ]; then git add "$p"; fi; done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh data snapshot"
          git pull --rebase --autostash
          git push
          # pushes made with the workflow token don't start a Pages build on their own
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
