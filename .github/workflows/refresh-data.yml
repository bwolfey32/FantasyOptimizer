# Refreshes snapshot.json, the saved copy of the data that the site shows instantly while live data loads
# (and keeps showing if Sleeper or ESPN can't be reached). Runs every 3 hours, or on demand from the Actions tab.
name: Refresh data

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # served over http, not file://, because ESPN's ownership feed rejects requests from file pages
      - name: Render the page in export mode
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --user-data-dir="$RUNNER_TEMP/chrome" \
            --virtual-time-budget=240000 --dump-dom "http://127.0.0.1:8000/index.html#export" > "$RUNNER_TEMP/dom.html"

      - name: Save snapshot.json
        run: python3 scripts/extract_snapshot.py "$RUNNER_TEMP/dom.html" snapshot.json

      # checks the frozen forecasts of finished weeks against what players scored; a failure here never blocks the snapshot
      - name: Check past forecasts against results
        run: python3 scripts/calibrate.py || echo "Calibration skipped this run"

      # Sleeper and ESPN ids for player headshots; rebuilt at most once a day, and a failure keeps the old map
      - name: Update player ids
        run: python3 scripts/player_ids.py player-ids.json || echo "Player ids kept from the last run"

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          for p in snapshot.json forecasts calibration.json player-ids.json; do if [ -e "$p" ]; then git add "$p"; fi; done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh data snapshot"
          git pull --rebase --autostash
          git push
          # pushes made with the workflow token don't start a Pages build on their own
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
